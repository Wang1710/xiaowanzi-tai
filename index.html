      <div class="form-row"><label>所属文件夹</label>
        <select id="cl-folder">${cl.folders.map(f=>`<option value="${f.id}" ${l.folderId===f.id?'selected':''}>${App.Utils.escapeHtml(f.name)}</option>`).join('')}</select>
      </div>
      <div class="form-actions">
        <button class="btn btn-ghost" onclick="App.closeModal()">取消</button>
        <button class="btn btn-primary" id="cl-save">保存</button>
      </div>`);
    App.bindSpeechBtns();
    document.getElementById('cl-save').addEventListener('click',()=>{
      const title=document.getElementById('cl-title').value.trim();if(!title){App.showToast('请填写标题');return}
      const folderId=document.getElementById('cl-folder').value;
      const cl=App.Store.getChecklists();
      if(isEdit){
        const idx=cl.lists.findIndex(x=>x.id===list.id);
        cl.lists[idx].title=title;cl.lists[idx].folderId=folderId;cl.lists[idx].updatedAt=new Date().toISOString();
      }else{
        cl.lists.push({id:App.Utils.generateUUID(),folderId,title,items:[],versionHistory:[],createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()});
      }
      App.Store.setChecklists(cl);App.closeModal();App._renderChecklistAll();
    });
  }
  function addFolder(){
    App.openModal('新建文件夹',`
      <div class="form-row"><label>文件夹名称</label><input type="text" id="f-name" placeholder="如：旅行"></div>
      <div class="form-actions"><button class="btn btn-ghost" onclick="App.closeModal()">取消</button><button class="btn btn-primary" id="f-save">添加</button></div>`);
    document.getElementById('f-save').addEventListener('click',()=>{
      const name=document.getElementById('f-name').value.trim();if(!name){App.showToast('请输入名称');return}
      const cl=App.Store.getChecklists();cl.folders=cl.folders||[];cl.folders.push({id:App.Utils.generateUUID(),name,createdAt:new Date().toISOString()});
      App.Store.setChecklists(cl);App.closeModal();App._renderChecklistAll();
    });
  }
  function openHistory(listId){
    const cl=App.Store.getChecklists();const l=cl.lists.find(x=>x.id===listId);
    const versions=l.versionHistory||[];
    if(!versions.length){App.showToast('暂无历史版本（修改后自动留存）');return}
    App.openModal('历史版本',`<div id="ver-list">${versions.slice().reverse().map((v,i)=>{
      const idx=versions.length-1-i;
      return `<div class="card mb6" style="padding:8px 10px">
        <div class="row mb6"><span class="flex1 fs-sm c-2">${v.savedAt.slice(0,16).replace('T',' ')}</span>
        <button class="btn btn-ghost btn-sm ver-restore" data-idx="${idx}">恢复</button></div>
        <div class="fs-xs c-3">${v.items.length} 条</div>
      </div>`;
    }).join('')}</div>
    <div class="form-actions"><button class="btn btn-ghost" onclick="App.closeModal()">关闭</button></div>`);
    document.querySelectorAll('.ver-restore').forEach(b=>b.addEventListener('click',()=>{
      const idx=+b.dataset.idx;
      const cl=App.Store.getChecklists();const l=cl.lists.find(x=>x.id===listId);
      saveVersion(l);
      l.items=JSON.parse(JSON.stringify(versions[idx].items));
      l.updatedAt=new Date().toISOString();App.Store.setChecklists(cl);
      App.closeModal();App._renderChecklistAll();App.showToast('已恢复该版本');
    }));
  }
  function syncToDaily(listId){
    const cl=App.Store.getChecklists();const l=cl.lists.find(x=>x.id===listId);
    const essentials=l.items.filter(i=>i.essential&&!i.completed);
    if(!essentials.length){App.showToast('无需同步的必备项');return}
    const today=App.Utils.todayStr();
    const d=App.Store.getDaily(today);d.tasks=d.tasks||[];
    let added=0;
    essentials.forEach(it=>{
      if(!d.tasks.some(t=>t.content===it.content&&t.type==='todo')){
        d.tasks.push({id:App.Utils.generateUUID(),type:'todo',content:it.content,completed:false,createdAt:new Date().toISOString(),syncedFrom:it.id});
        added++;
      }
    });
    App.Store.setDaily(today,d);
    App.showToast(`已同步 ${added} 项到今日待办`);
  }
  function exportCSV(){
    const cl=App.Store.getChecklists();
    const folders=cl.folders||[];const fMap={};folders.forEach(f=>fMap[f.id]=f.name);
    const rows=[];
    (cl.lists||[]).forEach(l=>{
      (l.items||[]).forEach(it=>{
        rows.push({清单:l.title,文件夹:fMap[l.folderId]||'',条目:it.content,类型:it.essential?'必备':'可选',状态:it.completed?'已完成':'未完成',更新时间:(l.updatedAt||'').slice(0,16)});
      });
    });
    if(!rows.length){App.showToast('无数据');return}
    App.Utils.exportCSV(rows,'清单小盒');
  }
  return {render};
})();

/* ============ 每日一瞬 Moment ============ */
App.Modules.Moment = (function(){
  const WEEK=['日','一','二','三','四','五','六'];
  let weekStart=null;     // 当前显示周的周一
  let selectedDate=App.Utils.todayStr();

  function parseDate(s){return App.Utils.parseDate(s)}
  function fmtDate(d){return App.Utils.formatDate(d)}
  function mondayOf(d){ // 返回含 d 的那一周的周一
    const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());
    const day=x.getDay(); // 0=周日..6=周六
    const diff=(day===0)?-6:(1-day);
    x.setDate(x.getDate()+diff);
    return x;
  }
  function prettyDate(s){
    const d=parseDate(s);if(!d)return s;
    return `${d.getMonth()+1}月${d.getDate()}日 周${WEEK[d.getDay()]}`;
  }
  // 图片压缩为 dataURL（限制尺寸，减小 localStorage 体积）
  function fileToDataURL(file,maxW,maxH,cb){
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        let w=img.width,h=img.height;
        if(w>maxW||h>maxH){const r=Math.min(maxW/w,maxH/h);w=Math.round(w*r);h=Math.round(h*r);}
        const cv=document.createElement('canvas');cv.width=w;cv.height=h;
        const ctx=cv.getContext('2d');
        try{ctx.drawImage(img,0,0,w,h);}catch(err){cb(reader.result);return;}
        try{cb(cv.toDataURL('image/jpeg',0.72));}catch(err){cb(reader.result);}
      };
      img.onerror=()=>cb(reader.result);
      img.src=reader.result;
    };
    reader.readAsDataURL(file);
  }

  function render(){
    if(!weekStart)weekStart=mondayOf(new Date());
    const panel=document.getElementById('view-moment');
    panel.innerHTML=`
      <div class="view-header"><h2>📸 每日一瞬</h2></div>
      <div class="card">
        <div class="moment-weekbar">
          <div class="mw-btn" id="m-prev" title="上一周">‹</div>
          <div class="mw-range" id="m-range"></div>
          <div class="mw-btn" id="m-next" title="下一周">›</div>
          <div class="mw-btn" id="m-thisweek" title="回到本周" style="font-size:13px">今</div>
        </div>
        <div class="moment-wall" id="m-wall"></div>
        <div class="moment-hint">照片墙展示整周一瞬，点照片全屏放大，点格子选定日期</div>
      </div>
      <div class="card moment-input">
        <div class="card-header"><h3>记录一瞬</h3></div>
        <div class="form-row">
          <label>日期</label>
          <input type="date" id="m-date" class="inp" value="${selectedDate}">
        </div>
        <div class="form-row">
          <label>照片</label>
          <div class="row gap8">
            <div id="m-photo-prev" class="mi-ph">📷</div>
            <div class="row col flex1">
              <input type="file" id="m-photo" accept="image/*" style="font-size:var(--f-sm)">
              <span class="moment-hint">提交前请确认日期已选定</span>
            </div>
          </div>
        </div>
        <div class="form-row">
          <label>心情文字</label>
          <textarea id="m-text" placeholder="今天的一瞬，想说的话…"></textarea>
        </div>
        <div class="row gap8">
          <button class="btn btn-primary flex1" id="m-save">保存今日一瞬</button>
          <button class="btn btn-ghost" id="m-export">导出图文</button>
        </div>
      </div>`;
    bindWeekNav();
    bindInput();
    renderWall();
  }

  function bindWeekNav(){
    document.getElementById('m-prev').addEventListener('click',()=>{weekStart.setDate(weekStart.getDate()-7);renderWall();});
    document.getElementById('m-next').addEventListener('click',()=>{weekStart.setDate(weekStart.getDate()+7);renderWall();});
    document.getElementById('m-thisweek').addEventListener('click',()=>{weekStart=mondayOf(new Date());selectedDate=App.Utils.todayStr();syncDateInput();renderWall();});
  }

  function bindInput(){
    const dateEl=document.getElementById('m-date');
    dateEl.addEventListener('change',()=>{selectedDate=dateEl.value||App.Utils.todayStr();renderWall();});
    const photoEl=document.getElementById('m-photo');
    const prev=document.getElementById('m-photo-prev');
    photoEl.addEventListener('change',function(){
      const f=this.files&&this.files[0];
      if(!f)return;
      fileToDataURL(f,1080,1080,dataUrl=>{prev.innerHTML=`<img class="mi-photo" src="${dataUrl}">`;prev.dataset.preview=dataUrl;});
      this.value='';
    });
    document.getElementById('m-save').addEventListener('click',saveRecord);
    document.getElementById('m-export').addEventListener('click',exportAll);
  }

  function syncDateInput(){
    const el=document.getElementById('m-date');
    if(el)el.value=selectedDate;
  }

  function renderWall(){
    const all=App.Store.getMomentAll();
    const wall=document.getElementById('m-wall');
    if(!wall)return;
    const ws=weekStart;
    const we=new Date(ws);we.setDate(we.getDate()+6);
    const rangeEl=document.getElementById('m-range');
    if(rangeEl)rangeEl.textContent=`${ws.getMonth()+1}/${ws.getDate()} – ${we.getMonth()+1}/${we.getDate()}`;
    const today=App.Utils.todayStr();
    const CN=['周一','周二','周三','周四','周五','周六','周日'];
    // 照片墙 3×3：第1格日期、第2格月历、第3格起为周一~周日
    let html='';
    html+=`<div class="moment-cell moment-date-cell">
      <div class="mdc-title">Weekly</div>
      <div class="mdc-range">${ws.getMonth()+1}/${ws.getDate()} – ${we.getMonth()+1}/${we.getDate()}</div>
    </div>`;
    html+=`<div class="moment-cell moment-cal-cell">
      ${renderMiniCalendar(ws.getFullYear(),ws.getMonth(),all)}
    </div>`;
    for(let i=0;i<7;i++){
      const d=new Date(ws);d.setDate(d.getDate()+i);
      const ds=fmtDate(d);
      const rec=all[ds];
      const isToday=ds===today;
      const isSelected=ds===selectedDate;
      const photo=rec&&rec.photo?`<img class="moment-card-photo" src="${rec.photo}" data-src="${rec.photo}">`:`<div class="moment-card-ph">📷</div>`;
      html+=`<div class="moment-day-cell ${isSelected?'selected':''}" data-date="${ds}">
        <div class="mdc-head">
          <span class="mp-dow">${CN[i]}</span>
          <span class="mp-num ${isToday?'today':''}">${d.getDate()}</span>
        </div>
        ${photo}
      </div>`;
    }
    wall.innerHTML=html;
    wall.querySelectorAll('.moment-day-cell[data-date]').forEach(card=>{
      card.addEventListener('click',()=>{
        selectedDate=card.dataset.date;syncDateInput();renderWall();
        App.showToast('已选定 '+prettyDate(selectedDate));
      });
    });
    wall.querySelectorAll('.moment-card-photo').forEach(img=>{
      img.addEventListener('click',e=>{e.stopPropagation();App.openLightbox(img.dataset.src);});
    });
    // 照片墙为网格布局，所有格子均可见，无需滚动定位
    const selCard=wall.querySelector('.moment-day-cell.selected');
    if(selCard){
      selCard.scrollIntoView({behavior:'auto',block:'nearest'});
    }
    wall.querySelectorAll('.moment-cal-grid .cal-day[data-date]').forEach(el=>{
      el.addEventListener('click',e=>{
        e.stopPropagation();
        const ds=el.dataset.date;if(!ds)return;
        selectedDate=ds;
        const d=parseDate(ds);if(!d)return;
        weekStart=mondayOf(d);
        syncDateInput();renderWall();
      });
    });
  }

  function renderMiniCalendar(year,month,all){
    const first=new Date(year,month,1);
    const start=new Date(first);start.setDate(start.getDate()-(first.getDay()||7)+1); // 周一开头
    const today=App.Utils.todayStr();
    const DOW=['一','二','三','四','五','六','日'];
    let html='<div class="moment-cal-grid">';
    DOW.forEach(d=>html+=`<div class="cal-dow">${d}</div>`);
    for(let w=0;w<6;w++){
      for(let d=0;d<7;d++){
        const cell=new Date(start);cell.setDate(start.getDate()+w*7+d);
        const ds=fmtDate(cell);
        const inMonth=cell.getMonth()===month;
        const has=all[ds];
        const isToday=ds===today;
        html+=`<div class="cal-day ${inMonth?'':'other'} ${has?'has':''} ${isToday?'today':''}" data-date="${ds}">${cell.getDate()}</div>`;
      }
    }
    html+='</div>';
    return html;
  }

  function saveRecord(){
    const dateEl=document.getElementById('m-date');
    const ds=dateEl.value||selectedDate;
    if(!ds){App.showToast('请先选择日期');return;}
    selectedDate=ds;
    const text=document.getElementById('m-text').value.trim();
    const prev=document.getElementById('m-photo-prev');
    const photo=prev.dataset.preview||'';
    if(!text&&!photo){App.showToast('请上传照片或输入心情文字');return;}
    if(photo){
      App.Store.setMoment(ds,{photo,text});
    }else{
      const existing=App.Store.getMoment(ds)||{};
      App.Store.setMoment(ds,{photo:existing.photo||'',text});
    }
    App.showToast('已保存 '+prettyDate(ds)+'，已同步到首页封面');
    prev.innerHTML='📷';delete prev.dataset.preview;
    document.getElementById('m-text').value='';
    if(App.Router.getCurrentView()==='moment')renderWall();
    // 双向同步：刷新首页封面
    if(App.Modules.Home&&App.Router.getCurrentView()==='home')App.Modules.Home.render();
  }

  function exportAll(){
    const all=App.Store.getMomentAll();
    const keys=Object.keys(all);
    if(!keys.length){App.showToast('还没有任何一瞬记录');return;}
    const data={_app:'xiaowanzi-moment',_version:1,_exportedAt:new Date().toISOString(),records:all};
    const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download=`每日一瞬_图文_${App.Utils.todayStr()}.json`;
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    App.showToast('已导出 '+keys.length+' 条图文');
  }

  function onShow(){ if(!weekStart)weekStart=mondayOf(new Date()); renderWall(); }
  return {render,onShow};
})();

/* ============ 书海小藏 Books ============ */
App.Modules.Books = (function(){
  const STATUSES=[
    {key:'recommend',label:'推荐'},
    {key:'reading',label:'在读'},
    {key:'unread',label:'未读'},
    {key:'read',label:'已读'}
  ];
  const STATUS_COLOR={recommend:'var(--c-purple)',reading:'var(--c-blue)',unread:'var(--text-3)',read:'var(--c-green)'};
  let currentFilter='all';
  function getList(){return App.Store.getBooks();}
  function saveList(arr){App.Store.setBooks(arr);}
  function findBook(id){return getList().find(b=>b.id===id);}
  function updateBook(id,fn){const l=getList();const b=l.find(x=>x.id===id);if(!b)return;fn(b);saveList(l);}
  // 图片压缩为 dataURL（限制宽高，减小体积）
  function fileToDataURL(file,maxW,maxH,cb){
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        let w=img.width,h=img.height;
        if(w>maxW||h>maxH){
          const r=Math.min(maxW/w,maxH/h);w=Math.round(w*r);h=Math.round(h*r);
        }
        const cv=document.createElement('canvas');cv.width=w;cv.height=h;
        const ctx=cv.getContext('2d');
        try{ctx.drawImage(img,0,0,w,h);}catch(err){cb(reader.result);return;}
        try{cb(cv.toDataURL('image/jpeg',0.7));}catch(err){cb(reader.result);}
      };
      img.onerror=()=>cb(reader.result);
      img.src=reader.result;
    };
    reader.readAsDataURL(file);
  }
  function render(){
    const panel=document.getElementById('view-books');
    panel.innerHTML=`
      <div class="view-header"><h2>书海小藏</h2>
        <button class="btn btn-primary btn-sm" id="book-add">＋ 新增书</button>
      </div>
      <div class="book-filter" id="book-filter">
        <span class="bf ${currentFilter==='all'?'active':''}" data-f="all">全部</span>
        ${(()=>{let s='';STATUSES.forEach(st=>{s+=`<span class="bf ${currentFilter===st.key?'active':''}" data-f="${st.key}">${st.label}</span>`;});return s;})()}
      </div>
      <div class="book-list" id="book-list"></div>
      <div id="cover-zoom" class="cover-zoom"><img alt="书封大图"><div class="cz-actions"><button class="btn btn-ghost btn-sm" id="cz-change">换封面</button></div><span class="cz-tip">点击任意处关闭</span></div>`;
    // 筛选切换
    document.getElementById('book-filter').querySelectorAll('.bf').forEach(el=>{
      el.addEventListener('click',()=>{currentFilter=el.dataset.f;render();});
    });
    document.getElementById('book-add').addEventListener('click',addBook);
    // 封面放大层
    const zoom=document.getElementById('cover-zoom');
    zoom.addEventListener('click',e=>{
      if(e.target.id==='cz-change')return;
      zoom.classList.remove('show');
    });
    const czChange=document.getElementById('cz-change');
    if(czChange)czChange.addEventListener('click',function(e){
      e.stopPropagation();
      const src=zoom.querySelector('img').src;
      // 找到对应书的 cover-input 触发上传
      const matchId=getList().find(b=>b.cover===src)?.id;
      const inp=matchId?document.querySelector('.book-cover .cover-input[data-id="'+matchId+'"]'):null;
      zoom.classList.remove('show');
      if(inp)inp.click();
    });
    renderList();
  }
  function renderList(){
    const el=document.getElementById('book-list');if(!el)return;
    let list=getList();
    if(currentFilter!=='all')list=list.filter(b=>b.status===currentFilter);
    if(!list.length){
      el.innerHTML=`<div class="empty-state" style="padding:20px">${currentFilter==='all'?'书架还空空如也，点击右上角「＋ 新增书」吧 📚':'该状态暂无书籍'}</div>`;
      return;
    }
    el.innerHTML=list.map(b=>{
      const status=STATUSES.find(s=>s.key===b.status)||STATUSES[2];
      const stars=Array.from({length:5},(_,i)=>`<span class="book-star ${i<(b.stars||0)?'on':''}" data-id="${b.id}" data-v="${i+1}">★</span>`).join('');
      const cover=b.cover?`<img src="${b.cover}" alt="封面">`:`<span class="cover-ph">📕</span>`;
      return `<div class="book-card" data-id="${b.id}">
        <div class="book-card-top">
          <div class="book-cover" data-id="${b.id}">
            ${cover}
            <span class="cover-upload">点击换图</span>
            <input type="file" accept="image/*" class="cover-input" data-id="${b.id}" style="display:none">
          </div>
          <div class="book-main">
            <div class="book-title-row">
              <div style="flex:1;min-width:0">
                <div class="book-title">${App.Utils.escapeHtml(b.title||'未命名')}</div>
                ${b.author?`<div class="book-author">${App.Utils.escapeHtml(b.author)}</div>`:''}
              </div>
              <button class="btn-icon book-del" data-id="${b.id}" title="删除">×</button>
            </div>
            <div class="book-status-row">
              ${STATUSES.map(s=>`<span class="book-status ${b.status===s.key?'active':''}" data-id="${b.id}" data-s="${s.key}">${s.label}</span>`).join('')}
            </div>
            <div class="book-stars" title="推荐星">${stars}</div>
          </div>
        </div>
        <textarea class="book-note" data-id="${b.id}" placeholder="备注/读后感…">${App.Utils.escapeHtml(b.note||'')}</textarea>
      </div>`;
    }).join('');
    bindEvents();
  }
  function bindEvents(){
    // 封面上传 / 放大
    document.querySelectorAll('#book-list .book-cover').forEach(c=>{
      c.addEventListener('click',e=>{
        if(e.target.classList.contains('cover-input'))return;
        const id=c.dataset.id;const b=findBook(id);
        if(b&&b.cover){
          const zoom=document.getElementById('cover-zoom');
          zoom.querySelector('img').src=b.cover;
          zoom.classList.add('show');
        }else{
          const inp=c.querySelector('.cover-input');if(inp)inp.click();
        }
      });
    });
    document.querySelectorAll('#book-list .cover-input').forEach(inp=>{
      inp.addEventListener('change',function(){
        const f=this.files&&this.files[0];if(!f)return;
        const id=this.dataset.id;
        fileToDataURL(f,400,560,dataUrl=>{
          updateBook(id,b=>{b.cover=dataUrl;});
          renderList();
        });
        this.value='';
      });
    });
    // 封面放大
    document.querySelectorAll('#book-list .book-cover img').forEach(img=>{
      img.addEventListener('click',e=>{
        e.stopPropagation();
        const zoom=document.getElementById('cover-zoom');
        zoom.querySelector('img').src=img.src;
        zoom.classList.add('show');
      });
    });
    // 删除
    document.querySelectorAll('#book-list .book-del').forEach(b=>{
      b.addEventListener('click',function(){
        const id=this.dataset.id;const bk=findBook(id);
        const bkName=bk?bk.title:'该书';
        if(!confirm('确定删除《'+bkName+'》吗？'))return;
        saveList(getList().filter(x=>x.id!==id));renderList();
      });
    });
    // 状态切换
    document.querySelectorAll('#book-list .book-status').forEach(s=>{
      s.addEventListener('click',function(){
        const id=this.dataset.id,val=this.dataset.s;
        updateBook(id,b=>{b.status=val;});renderList();
      });
    });
    // 星级
    document.querySelectorAll('#book-list .book-star').forEach(st=>{
      st.addEventListener('click',function(e){
        e.stopPropagation();
        const id=this.dataset.id,v=+this.dataset.v;
        updateBook(id,b=>{b.stars=(b.stars===v)?v-1:v;});renderList();
      });
    });
    // 备注
    document.querySelectorAll('#book-list .book-note').forEach(ta=>{
      ta.addEventListener('blur',function(){
        const id=this.dataset.id;updateBook(id,b=>{b.note=this.value;});
      });
    });
  }
  function addBook(){
    App.openModal('新增书籍',`
      <div class="form-row"><label>书名</label><input type="text" id="nb-title" placeholder="如：百年孤独"></div>
      <div class="form-row"><label>作者（可选）</label><input type="text" id="nb-author" placeholder="如：马尔克斯"></div>
      <div class="form-row"><label>初始状态</label>
        <select id="nb-status">
          ${STATUSES.map(s=>`<option value="${s.key}">${s.label}</option>`).join('')}
        </select>
      </div>
      <div class="form-actions"><button class="btn btn-ghost" onclick="App.closeModal()">取消</button>
        <button class="btn btn-primary" id="nb-save">保存</button></div>`);
    document.getElementById('nb-save').addEventListener('click',()=>{
      const title=document.getElementById('nb-title').value.trim();
      if(!title){App.showToast('请填写书名');return;}
      const author=document.getElementById('nb-author').value.trim();
      const status=document.getElementById('nb-status').value;
      const list=getList();
      list.push({id:App.Utils.generateUUID(),title,author,status,stars:0,cover:'',note:'',createdAt:new Date().toISOString()});
      saveList(list);
      App.closeModal();
      App.showToast('已加入书架 📚');
      if(currentFilter!=='all'&&currentFilter!==status)currentFilter='all';
      renderList();
    });
  }
  function onShow(){renderList();}
  return {render,onShow};
})();

App.Modules.Tasks = (function(){
  let currentDate=App.Utils.todayStr();
  const DEFAULT_TASK_CATS=[
    {key:'life', label:'生活', color:'#7ab87a'},
    {key:'work', label:'工作', color:'#5b8db8'}
  ];
  function getTaskCats(){

    const custom=s.customTaskCats||[];
    const map={};
    DEFAULT_TASK_CATS.forEach(c=>map[c.key]={...c});
    custom.forEach(c=>map[c.key]={...c});
    return Object.values(map);
  }
  function getTaskCatColor(key){const c=getTaskCats().find(x=>x.key===key);return c?c.color:'#999';}
  function getTaskCatLabel(key){const c=getTaskCats().find(x=>x.key===key);return c?c.label:'其他';}
  function getDefaultTaskCat(key){return DEFAULT_TASK_CATS.find(x=>x.key===key);}
  function saveCustomTaskCats(arr){App.Store.setSettings({customTaskCats:arr});}
  function getEntry(){return App.Store.getDaily(currentDate)}
  function saveEntry(e){App.Store.setDaily(currentDate,e)}
  function render(){
    const panel=document.getElementById('view-tasks');
    panel.innerHTML=`
      <div class="date-picker">
        <button class="btn-icon" id="t-prev">‹</button>
        <span class="date-text" id="t-date"></span>
        <button class="btn-icon" id="t-next">›</button>
        <button class="btn-text" id="t-today">今天</button>
      </div>
      <div class="card">
        <div class="card-header"><h3>事项管理</h3><div class="row gap4"><button class="btn btn-ghost btn-sm" id="task-cat-manage">⚙ 分类</button><span class="count" id="task-count">0</span></div></div>
        <div class="card-body">
          <div class="row wrap mb6" style="gap:6px">
            <select id="task-type" style="width:auto;min-width:78px"><option value="todo">计划待办</option><option value="reminder">事项提醒</option></select>
            <select id="task-priority" class="task-priority-select"><option value="0">日常</option><option value="1">❗</option><option value="2">❗❗</option></select>
            <select id="task-category" class="task-category-select">${getTaskCats().map(c=>`<option value="${c.key}">${App.Utils.escapeHtml(c.label)}</option>`).join('')}</select>
            ${App.speechBtnHTML('task-input')}
          </div>
          <div class="row task-input-group mb6" style="gap:6px">
            <input type="text" id="task-input" placeholder="输入事项…" style="flex:1;min-width:0">
            <button class="btn btn-primary btn-sm" id="task-add">＋</button>
          </div>
          <div class="tasks-list" id="task-list"></div>
        </div>
      </div>`;
    document.getElementById('t-prev').addEventListener('click',()=>shiftDay(-1));
    document.getElementById('t-next').addEventListener('click',()=>shiftDay(1));
    document.getElementById('t-today').addEventListener('click',()=>{currentDate=App.Utils.todayStr();renderDay();});
    panel.addEventListener('click',(e)=>{
      const btn=e.target.closest('#task-add');if(btn){e.preventDefault();e.stopPropagation();addTask();return}
    });
    panel.addEventListener('keydown',(e)=>{
      if(e.target.id==='task-input'&&e.key==='Enter'){e.preventDefault();addTask()}
    });
    App.bindSpeechBtns();
    document.getElementById('task-type').addEventListener('change',function(){
      const p=document.getElementById('task-priority');
      if(p)p.style.display=this.value==='todo'?'':'none';
    });
    document.getElementById('task-cat-manage').addEventListener('click',openCatManage);
    renderDay();
  }
  function shiftDay(delta){
    const d=App.Utils.parseDate(currentDate);d.setDate(d.getDate()+delta);
    currentDate=App.Utils.formatDate(d);renderDay();
  }
  function renderDay(){
    document.getElementById('t-date').textContent=`${currentDate} 周${App.Utils.weekStr(App.Utils.parseDate(currentDate))}`;
    renderTasks();
  }
  function renderTasks(){
    const entry=getEntry();const tasks=entry.tasks||[];
    document.getElementById('task-count').textContent=tasks.length;
    const todos=tasks.filter(t=>t.type==='todo');
    const reminders=tasks.filter(t=>t.type==='reminder');
    const pending=todos.filter(t=>!t.completed).sort((a,b)=>(b.priority||0)-(a.priority||0));
    const done=todos.filter(t=>t.completed);
    function groupByCategory(arr){
      const cats=getTaskCats();
      const groups={};
      cats.forEach(c=>groups[c.key]=[]);
      groups['_other']=[];
      arr.forEach(t=>{
        const k=t.category||'_other';
        if(groups[k]) groups[k].push(t); else groups['_other'].push(t);
      });
      return cats.map(c=>({cat:c,items:groups[c.key]})).filter(g=>g.items.length).concat(groups['_other'].length?[{cat:{key:'_other',label:'其他',color:'#999'},items:groups['_other']}]:[]);
    }
    function renderCatGroup(g){
      return `<div class="task-cat-header"><span class="task-cat-dot" style="background:${g.cat.color}"></span>${App.Utils.escapeHtml(g.cat.label)}</div>${g.items.map(renderItem).join('')}`;
    }
    function renderItem(t){
      const isTodo=t.type==='todo';
      const pri=['','❗','❗❗'][t.priority||0];
      const color=getTaskCatColor(t.category);
      const check=isTodo?`<span class="task-icon task-check ${t.completed?'checked':''}" data-id="${t.id}">${t.completed?'✓':''}</span>`:`<span class="task-icon" data-id="${t.id}">📌</span>`;
      return `<div class="task-item ${t.type} ${isTodo&&t.completed?'completed':''}" data-id="${t.id}" style="border-left-color:${color}">
        ${check}
        <span class="task-content" data-id="${t.id}">${App.Utils.escapeHtml(t.content)}${isTodo&&pri?`<span class="task-priority">${pri}</span>`:''}</span>
        <button class="btn-icon task-del" data-id="${t.id}" style="width:28px;height:28px;font-size:12px">×</button>
      </div>`;
    }
    function renderSection(title,list){
      if(!list.length)return '';
      const groups=groupByCategory(list);
      return `<div class="task-section"><div class="task-section-title">${title}</div>${groups.map(renderCatGroup).join('')}</div>`;
    }
    let html='';
    html+=renderSection('待办',pending);
    html+=renderSection('提醒',reminders);
    if(done.length){
      const groups=groupByCategory(done);
      html+=`<div class="tasks-completed-section" id="tasks-completed-sec">
        <div class="tasks-completed-toggle">✅ 已完成 (${done.length}) <span style="margin-left:auto;font-size:10px">▸</span></div>
        <div class="tasks-completed-body">${groups.map(renderCatGroup).join('')}</div>
      </div>`;
    }
    if(!tasks.length) html='<div class="empty-state" style="padding:12px">暂无事项</div>';
    document.getElementById('task-list').innerHTML=html;
    bindTaskEvents();
  }
  function bindTaskEvents(){
    document.querySelectorAll('#task-list .task-check').forEach(el=>el.addEventListener('click',e=>{
      e.stopPropagation();
      const id=el.dataset.id;const entry=getEntry();
      const t=entry.tasks.find(x=>x.id===id);if(!t)return;
      t.completed=!t.completed;saveEntry(entry);renderTasks();
    }));
    document.querySelectorAll('#task-list .task-content').forEach(el=>el.addEventListener('click',e=>{
      e.stopPropagation();editTask(el.dataset.id);
    }));
    document.querySelectorAll('#task-list .task-del').forEach(b=>b.addEventListener('click',e=>{
      e.stopPropagation();const entry=getEntry();entry.tasks=entry.tasks.filter(x=>x.id!==b.dataset.id);saveEntry(entry);renderTasks();
    }));
    const sec=document.getElementById('tasks-completed-sec');
    if(sec)sec.querySelector('.tasks-completed-toggle').addEventListener('click',()=>sec.classList.toggle('open'));
  }
  function editTask(id){
    const entry=getEntry();const t=entry.tasks.find(x=>x.id===id);if(!t)return;
    const priOptions=t.type==='todo'?`<div class="form-row"><label>重要程度</label><select id="edit-task-priority"><option value="0">日常</option><option value="1">❗</option><option value="2">❗❗</option></select></div>`:'';
    const catOptions=`<div class="form-row"><label>分类</label><select id="edit-task-category">${getTaskCats().map(c=>`<option value="${c.key}" ${t.category===c.key?'selected':''}>${App.Utils.escapeHtml(c.label)}</option>`).join('')}</select></div>`;
    App.openModal('编辑事项',`
      <div class="form-row"><label>内容</label><input type="text" id="edit-task-content" value="${App.Utils.escapeHtml(t.content)}"></div>
      ${priOptions}
      ${catOptions}
      <div class="form-actions"><button class="btn btn-ghost" onclick="App.closeModal()">取消</button><button class="btn btn-primary" id="edit-task-save">保存</button></div>`);
    if(t.type==='todo')document.getElementById('edit-task-priority').value=t.priority||0;
    document.getElementById('edit-task-save').addEventListener('click',()=>{
      const nv=document.getElementById('edit-task-content').value.trim();
      if(!nv){App.showToast('内容不能为空');return;}
      t.content=nv;
      if(t.type==='todo')t.priority=+document.getElementById('edit-task-priority').value;
      t.category=document.getElementById('edit-task-category').value;
      saveEntry(entry);App.closeModal();renderTasks();App.showToast('已更新');
    });
  }
  function addTask(){
    const input=document.getElementById('task-input');const v=input.value.trim();if(!v)return;
    const type=document.getElementById('task-type').value;
    const priorityEl=document.getElementById('task-priority');
    const priority=type==='todo'&&priorityEl?+priorityEl.value:0;
    const categoryEl=document.getElementById('task-category');
    const category=categoryEl?categoryEl.value:'life';
    const e=getEntry();e.tasks=e.tasks||[];
    e.tasks.push({id:App.Utils.generateUUID(),type,content:v,completed:false,priority,category,createdAt:new Date().toISOString()});
    saveEntry(e);input.value='';renderTasks();
  }
  function openCatManage(){
    const cats=getTaskCats();
    let html='<div id="task-cat-list">';
    cats.forEach(c=>{
      const isDefault=!!getDefaultTaskCat(c.key);
      html+=`<div class="form-row cat-row" data-key="${c.key}">
        <input type="text" class="cat-label" value="${App.Utils.escapeHtml(c.label)}" placeholder="分类名称" style="flex:1;min-width:0">
        <input type="color" class="cat-color" value="${c.color}" style="width:36px;height:36px;border-radius:var(--r-sm);border:1px solid var(--border);padding:2px;flex-shrink:0">
        ${isDefault?'':'<button class="btn-icon cat-del" style="width:28px;height:28px;font-size:12px">×</button>'}
      </div>`;
    });
    html+='</div><button class="btn btn-ghost btn-sm mt8" id="task-cat-add">＋ 添加分类</button>';
    App.openModal('管理分类',`
      ${html}
      <div class="form-actions"><button class="btn btn-ghost" onclick="App.closeModal()">取消</button><button class="btn btn-primary" id="task-cat-save">保存</button></div>`);
    const listEl=document.getElementById('task-cat-list');
    document.getElementById('task-cat-add').addEventListener('click',()=>{
      const row=document.createElement('div');row.className='form-row cat-row';
      row.innerHTML=`<input type="text" class="cat-label" value="新分类" placeholder="分类名称" style="flex:1;min-width:0"><input type="color" class="cat-color" value="#999999" style="width:36px;height:36px;border-radius:var(--r-sm);border:1px solid var(--border);padding:2px;flex-shrink:0"><button class="btn-icon cat-del" style="width:28px;height:28px;font-size:12px">×</button>`;
      listEl.appendChild(row);
      row.querySelector('.cat-del').addEventListener('click',()=>row.remove());
    });
    document.querySelectorAll('.cat-row .cat-del').forEach(b=>b.addEventListener('click',()=>b.closest('.cat-row').remove()));
    document.getElementById('task-cat-save').addEventListener('click',()=>{
      const custom=[];
      document.querySelectorAll('.cat-row').forEach(r=>{
        const key=r.dataset.key;
        const label=r.querySelector('.cat-label').value.trim();
        const color=r.querySelector('.cat-color').value;
        if(!label)return;
        const def=getDefaultTaskCat(key);
        if(def){
          if(label!==def.label || color!==def.color) custom.push({key,label,color});
        }else{
          custom.push({key:key||'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),label,color});
        }
      });
      saveCustomTaskCats(custom);
      render();App.closeModal();App.showToast('分类已保存');
    });
  }
  function onShow(){renderDay();}
  return {render,onShow};
})();

(function(){
  function init(){
    // 检测 localStorage
    try{localStorage.setItem('__t__','1');localStorage.removeItem('__t__')}
    catch(e){App.showToast('请在 Safari 设置中关闭无痕模式后使用');return}
    // 语音支持检测
    // iOS Safari 的 webkitSpeechRecognition 不可用（service-not-allowed），
    // 统一改用「点击 🎤 → 聚焦输入框 → 用键盘左下角 🎙️ 听写键」方案
    const ua=navigator.userAgent||'';
    const isIOS=/iPad|iPhone|iPod/.test(ua)&&!/CriOS/.test(ua);
    if(isIOS){
      // 首次进入给一次性引导
      const shown=sessionStorage.getItem('__speech_hint__');
      if(!shown){
        sessionStorage.setItem('__speech_hint__','1');
        setTimeout(()=>App.showToast('点 🎤 按钮后，用键盘左下角 🎙️ 听写键说话',4500),2000);
      }
    }
    // 侧边栏交互：点击"燕"logo 拉出/收起菜单
    document.getElementById('sidebar-logo').addEventListener('click',()=>{
      const sb=document.getElementById('sidebar');
      if(sb.classList.contains('expanded'))App.Router.collapseSidebar();
      else App.Router.expandSidebar();
    });
    document.getElementById('sidebar-overlay').addEventListener('click',App.Router.collapseSidebar);
    // 全局图片放大层：点击任意处关闭
    const imgLb=document.getElementById('img-lightbox');
    if(imgLb)imgLb.addEventListener('click',App.closeLightbox);
    // 设置按钮
    document.getElementById('settings-btn').addEventListener('click',()=>{
      if(App.Modules.Settings)App.Modules.Settings.open();
    });
    // 初始化各模块（预渲染首页）
    Object.keys(App.Modules).forEach(k=>{
      const m=App.Modules[k];
      if(m&&m.init)m.init();
    });
    App.Router.init();
    // 全局搜索
    initGlobalSearch();
    // 月度简报检测
    checkMonthlyReport();
  }
  function initGlobalSearch(){
    const input=document.getElementById('global-search');
    const results=document.getElementById('search-results');
    const debouncedSearch=App.Utils.debounce(()=>{
      const q=input.value.trim();
      if(!q){results.classList.remove('visible');results.innerHTML='';return}
      const list=App.Store.searchAll(q);
      if(!list.length){
        results.innerHTML='<div class="search-empty">无匹配结果</div>';
      }else{
        results.innerHTML=list.slice(0,30).map((r,i)=>
          `<div class="search-result-item" data-idx="${i}">
            <div class="sr-module">${r.module}</div>
            <div class="sr-snippet">${r.snippet}</div>
          </div>`
        ).join('');
        results.querySelectorAll('.search-result-item').forEach(el=>{
          el.addEventListener('click',()=>{
            const idx=+el.dataset.idx;
            const r=list[idx];
            // 跳转到对应模块
            const map={'物品小集':'items','每日小事·速记':'daily','每日小事·事项':'daily','每日小事·心情':'daily','项目小栏':'projects','精油小册':'oils','灵感·清单':'inspiration','灵感·素材':'inspiration','灵感·翻译':'inspiration','盈亏管理':'profit','清单小盒':'checklist','每日一瞬':'moment'};
            const base=r.module.split('·')[0];
            const view={物品小集:'items',每日小事:'daily',项目小栏:'projects',精油小册:'oils',灵感:'inspiration',盈亏管理:'profit',清单小盒:'checklist',每日一瞬:'moment'}[base]||'home';
            App.Router.navigate(view);
            results.classList.remove('visible');input.value='';
          });
        });
      }
      results.classList.add('visible');
    },250);
    input.addEventListener('input',debouncedSearch);
    input.addEventListener('focus',()=>{if(input.value.trim()){debouncedSearch()}});
    document.addEventListener('click',(e)=>{
      if(!e.target.closest('.search-wrap')&&!e.target.closest('.search-results')){
        results.classList.remove('visible');
      }
    });
  }
  function checkMonthlyReport(){
    const now=new Date();
    // 每月1日，或随时可手动触发，这里仅静默标记上月简报是否已生成
    if(now.getDate()===1){
      const last=new Date(now.getFullYear(),now.getMonth()-1,1);
      App.Store.generateMonthlyReport(last.getFullYear(),last.getMonth()+1);
    }
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);
  else init();
})();
</script>
</body>
</html>
