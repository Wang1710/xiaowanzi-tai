    renderList();
  }
  function renderList(){
    const list=document.getElementById('items-list');
    const items=App.Store.getItems();
    if(!items.length){list.innerHTML='<div class="empty-state"><div class="es-icon">📦</div>暂无物品记录</div>';return}
    // 按购入日期倒序
    items.sort((a,b)=>(b.purchaseDate||'').localeCompare(a.purchaseDate||''));
    list.innerHTML=items.map(it=>`
      <div class="item-card" data-id="${it.id}">
        <div class="item-top">
          <span class="item-name">${App.Utils.escapeHtml(it.name||'未命名')}</span>
          <span class="item-price">¥${Number(it.price||0).toFixed(2)}</span>
          <div class="item-actions">
            <span class="badge status-${it.status||'闲置'}">${it.status||'闲置'}</span>
            <button class="btn-icon item-edit" data-id="${it.id}">✏️</button>
            <button class="btn-icon item-del" data-id="${it.id}">🗑️</button>
          </div>
        </div>
        <div class="item-meta">
          <span>📅 ${it.purchaseDate||'-'}</span>
          ${it.platform?`<span>🛒 ${App.Utils.escapeHtml(it.platform)}</span>`:''}
          ${it.note?`<span>📝 ${App.Utils.escapeHtml(it.note)}</span>`:''}
        </div>
      </div>`).join('');
    list.querySelectorAll('.item-edit').forEach(b=>b.addEventListener('click',e=>{
      e.stopPropagation();const it=items.find(x=>x.id===b.dataset.id);if(it)openForm(it);
    }));
    list.querySelectorAll('.item-del').forEach(b=>b.addEventListener('click',e=>{
      e.stopPropagation();
      App.confirmModal('确认删除该物品记录？',()=>{
        App.Store.setItems(App.Store.getItems().filter(x=>x.id!==b.dataset.id));
        renderList();App.showToast('已删除');
      });
    }));
  }
  function openForm(item){
    const isEdit=!!item;
    const it=item||{name:'',purchaseDate:App.Utils.todayStr(),platform:'',price:'',status:'在用',note:''};
    App.openModal(isEdit?'编辑物品':'新增物品',`
      <div class="form-row"><label>物品名称</label>
        <div class="row"><input type="text" id="f-name" placeholder="如：女儿文具套装" value="${App.Utils.escapeHtml(it.name)}">${App.speechBtnHTML('f-name')}</div>
      </div>
      <div class="form-row"><label>购入日期</label><input type="date" id="f-date" value="${it.purchaseDate}"></div>
      <div class="form-row"><label>购买平台</label>
        <div class="row"><input type="text" id="f-platform" placeholder="淘宝/京东/拼多多…" value="${App.Utils.escapeHtml(it.platform)}">${App.speechBtnHTML('f-platform')}</div>
      </div>
      <div class="form-row"><label>成交价格（元）</label><input type="number" id="f-price" step="0.01" placeholder="0.00" value="${it.price}"></div>
      <div class="form-row"><label>物品状态</label>
        <select id="f-status">${STATUSES.map(s=>`<option value="${s}" ${it.status===s?'selected':''}>${s}</option>`).join('')}</select>
      </div>
      <div class="form-row"><label>备注</label>
        <div class="row"><input type="text" id="f-note" placeholder="可选" value="${App.Utils.escapeHtml(it.note)}">${App.speechBtnHTML('f-note')}</div>
      </div>
      <div class="form-actions">
        <button class="btn btn-ghost" onclick="App.closeModal()">取消</button>
        <button class="btn btn-primary" id="f-save">保存</button>
      </div>`);
    App.bindSpeechBtns();
    document.getElementById('f-save').addEventListener('click',()=>{
      const data={
        name:document.getElementById('f-name').value.trim(),
        purchaseDate:document.getElementById('f-date').value,
        platform:document.getElementById('f-platform').value.trim(),
        price:document.getElementById('f-price').value,
        status:document.getElementById('f-status').value,
        note:document.getElementById('f-note').value.trim()
      };
      if(!data.name){App.showToast('请填写物品名称');return}
      const items=App.Store.getItems();
      if(isEdit){
        const idx=items.findIndex(x=>x.id===item.id);
        Object.assign(items[idx],data,{updatedAt:new Date().toISOString()});
      }else{
        items.push(Object.assign({id:App.Utils.generateUUID(),createdAt:new Date().toISOString()},data));
      }
      App.Store.setItems(items);
      App.closeModal();renderList();App.showToast(isEdit?'已更新':'已添加');
    });
  }
  function exportCSV(){
    const rows=App.Store.getItems().map(it=>({
      物品名称:it.name||'',购入日期:it.purchaseDate,购买平台:it.platform,成交价格:Number(it.price||0).toFixed(2),
      物品状态:it.status,备注:it.note||''
    }));
    App.Utils.exportCSV(rows,'物品小集');
  }
  return {render};
})();


/* ============ 项目小栏 Projects ============ */
App.Modules.Projects = (function(){
  const DEFAULT_CATS=[{key:'work',label:'工作',color:'#5b8db8',builtin:true},{key:'daughter',label:'女儿',color:'#d490a8',builtin:true},{key:'urgent',label:'重要紧急',color:'#c45b5b',builtin:true},{key:'normal',label:'普通杂事',color:'#3a3a3a',builtin:true}];
  function getCats(){
    const s=App.Store.getSettings();
    return DEFAULT_CATS.concat(s.customProjectCats||[]);
  }
  function getCatColor(k){const c=getCats().find(x=>x.key===k);return c?c.color:'#3a3a3a'}
  function getCatLabel(k){const c=getCats().find(x=>x.key===k);return c?c.label:k}
  const workBlues=['#4aa3e0','#5fb8e8','#7cc8f0','#38c2d6','#6aa8f0'];
  function getProjectColor(p,pi){
    if(p.color) return p.color;
    if(p.category!=='work') return getCatColor(p.category);
    return workBlues[(pi||0)%workBlues.length];
  }
  let ganttYear,ganttMonth;
  function render(){
    const now=new Date();ganttYear=now.getFullYear();ganttMonth=now.getMonth()+1;
    const panel=document.getElementById('view-projects');
    panel.innerHTML=`
      <div class="view-header">
        <h2>项目小栏</h2>
        <button class="btn btn-ghost btn-sm" id="proj-cats">分类管理</button>
        <button class="btn btn-primary btn-sm" id="proj-add">+ 新建项目</button>
      </div>
      <div class="gantt-month-nav">
        <button class="btn-icon" id="g-prev">‹</button>
        <span class="month-text" id="g-month"></span>
        <button class="btn-icon" id="g-next">›</button>
      </div>
      <div class="gantt-wrap" id="gantt-wrap"></div>
      <div class="gantt-legend" id="gantt-legend"></div>
      <div class="view-header mt10"><h3 style="font-size:var(--f-lg)">活跃项目</h3></div>
      <div id="active-list"></div>
      <details class="card"><summary>已归档项目</summary><div class="card-body"><div id="archived-list"></div></div></details>`;
    document.getElementById('proj-add').addEventListener('click',()=>openForm());
    document.getElementById('proj-cats').addEventListener('click',openCatManage);
    document.getElementById('g-prev').addEventListener('click',()=>shiftMonth(-1));
    document.getElementById('g-next').addEventListener('click',()=>shiftMonth(1));
    renderGantt();renderList();
  }
  function shiftMonth(delta){
    ganttMonth+=delta;
    if(ganttMonth<1){ganttMonth=12;ganttYear--}
    if(ganttMonth>12){ganttMonth=1;ganttYear++}
    renderGantt();
  }
      function renderGantt(){
        const daysInMonth=new Date(ganttYear,ganttMonth,0).getDate();
        const projects=App.Store.getProjects().filter(p=>p.status==='active');
        document.getElementById('g-month').textContent=`${ganttYear}年${ganttMonth}月`;
        const todayStr=App.Utils.todayStr();
        const dayNames=['一','二','三','四','五','六','日'];
        const isoDay=d=>{const wd=new Date(ganttYear,ganttMonth-1,d).getDay();return wd===0?7:wd};

        // 计算月历周数
        const firstDayWeek=isoDay(1);
        const totalCells=Math.ceil((firstDayWeek-1+daysInMonth)/7)*7;
        const weeks=totalCells/7;

        let html=`<div class="gantt-unified">`;

        // ===== 表头（星期几） =====
        html+=`<div class="gantt-unified-header">`;
        dayNames.forEach((name,i)=>{
          html+=`<div class="gu-head-day ${i>=5?'weekend':''}">${name}</div>`;
        });
        html+=`</div>`;

        const padBefore=firstDayWeek-1;

        // ===== 预计算每个项目在本月的连续日期区间 =====
        const projectBands=projects.map((p,pi)=>{
          const color=getProjectColor(p,pi);
          const days=new Set();
          const addRange=(rs,re)=>{for(let dd=Math.max(1,rs);dd<=Math.min(daysInMonth,re);dd++)days.add(dd);};
          let projStart=null,projEnd=null;
          if(p.startDate){
            const s=App.Utils.parseDate(p.startDate);
            if(s){
              const sy=s.getFullYear(),sm=s.getMonth()+1;
              if(sy<ganttYear||(sy===ganttYear&&sm<ganttMonth)) projStart=1;
              else if(sy===ganttYear&&sm===ganttMonth) projStart=s.getDate();
            }
          }
          if(p.endDate){
            const e=App.Utils.parseDate(p.endDate);
            if(e){
              const ey=e.getFullYear(),em=e.getMonth()+1;
              if(ey>ganttYear||(ey===ganttYear&&em>ganttMonth)) projEnd=daysInMonth;
              else if(ey===ganttYear&&em===ganttMonth) projEnd=e.getDate();
            }
          }
          if(projStart&&projEnd) addRange(projStart,projEnd);
          (p.tasks||[]).forEach(t=>{
            if(!t.date)return;
            const td=App.Utils.parseDate(t.date);
            if(td&&td.getFullYear()===ganttYear&&td.getMonth()+1===ganttMonth) days.add(td.getDate());
          });
          const sorted=Array.from(days).sort((a,b)=>a-b);
          const runs=[];let rs=null,re=null;
          sorted.forEach(d=>{if(rs===null){rs=d;re=d;}else if(d===re+1){re=d;}else{runs.push([rs,re]);rs=d;re=d;}});
          if(rs!==null)runs.push([rs,re]);
          return {p,pi,color,runs};
        });

        // ===== 月历体：日期格子 + 跨周连续色条叠加层 =====
        html+=`<div class="gantt-unified-body">`;
        for(let w=0;w<weeks;w++){
          html+=`<div class="gantt-week-row">`;
          for(let d=0;d<7;d++){
            const cellIndex=w*7+d;
            const dayOffset=cellIndex-padBefore;
            const dayNum=dayOffset+1;
            const isValidDay=dayNum>=1&&dayNum<=daysInMonth;
            const ds=isValidDay?`${ganttYear}-${String(ganttMonth).padStart(2,'0')}-${String(dayNum).padStart(2,'0')}`:'';
            const isToday=isValidDay&&ds===todayStr;
            const isWeekend=d>=5;

            let cellClass='gu-day-cell';
            if(!isValidDay) cellClass+=' empty';
            if(isWeekend&&isValidDay) cellClass+=' weekend';
            if(isToday) cellClass+=' today';

            let inner='';
            if(isValidDay){
              inner+=`<span class="gu-day-num ${isToday?'today-num':''}">${dayNum}</span>`;
            }
            html+=`<div class="${cellClass}">${inner}</div>`;
          }

          // 跨天色条：每个项目占一行，连续日期合并为一条
          const weekFirstDay=w*7-padBefore+1;
          html+=`<div class="gu-week-bars" style="grid-template-rows:repeat(${Math.max(1,projects.length)},6px)">`;
          projectBands.forEach(band=>{
            band.runs.forEach(([rs,re])=>{
              const barStart=Math.max(rs,Math.max(1,weekFirstDay));
              const barEnd=Math.min(re,Math.min(daysInMonth,weekFirstDay+6));
              if(barStart>barEnd)return;
              const cs=barStart-weekFirstDay+1;
              const ce=barEnd-weekFirstDay+2;
              html+=`<div class="gu-track-bar" style="grid-row:${band.pi+1};grid-column:${cs}/${ce};background:${band.color}" title="${App.Utils.escapeHtml(band.p.title)}"></div>`;
            });
          });
          html+=`</div>`;
          html+=`</div>`;
        }
        html+=`</div></div>`;

        document.getElementById('gantt-wrap').innerHTML=html;

        // 渲染项目图例
        const legendEl=document.getElementById('gantt-legend');
        if(legendEl){
          legendEl.innerHTML=projects.map((p,pi)=>{
            const color=getProjectColor(p,pi);
            return `<span class="lg"><span class="lg-dot fluoro" style="--bc:${color}"></span>${App.Utils.escapeHtml(p.title)}</span>`;
          }).join('');
        }
      }
  function renderList(){
    const projects=App.Store.getProjects();
    const now=new Date();now.setHours(0,0,0,0);
    const activeList=document.getElementById('active-list');
    const archivedList=document.getElementById('archived-list');
    const active=projects.filter(p=>p.status==='active');
    const archived=projects.filter(p=>p.status==='archived');

            <span class="cat-dot" style="background:${color}"></span>

          </div>
          <div class="pc-meta">

            ${p.description?`· <span>${App.Utils.escapeHtml(p.description)}</span>`:''}
            ${p.tasks&&p.tasks.length?`· ${p.tasks.filter(t=>t.completed).length}/${p.tasks.length}任务`:''}
          </div>
        </div>`;

        e.stopPropagation();

          renderGantt();renderList();App.showToast('已删除');
        });

    if(!archived.length){archivedList.innerHTML='<div class="empty-state" style="padding:12px">暂无归档项目</div>'}
    else{
      archivedList.innerHTML=archived.map((p,pi)=>{
        const color=getProjectColor(p,pi);
        return `<div class="project-card cat-${p.category}" data-id="${p.id}" style="border-left-color:${color}">
          <div class="pc-top">
            <span class="cat-dot" style="background:${color}"></span>
            <span class="pc-title">${App.Utils.escapeHtml(p.title)}</span>
            <span class="badge badge-optional">已归档</span>
            <button class="btn-icon proj-restore" data-id="${p.id}" style="width:28px;height:28px;font-size:13px">↩️</button>
            <button class="btn-icon proj-del" data-id="${p.id}" style="width:28px;height:28px;font-size:13px">×</button>
          </div>
          <div class="pc-meta"><span>${p.startDate||'?'}</span>~<span>${p.endDate||'?'}</span></div>
        </div>`;
      }).join('');
      archivedList.querySelectorAll('.proj-restore').forEach(b=>b.addEventListener('click',e=>{
        e.stopPropagation();const arr=App.Store.getProjects();const p=arr.find(x=>x.id===b.dataset.id);p.status='active';App.Store.setProjects(arr);
        renderGantt();renderList();App.showToast('已恢复');
      }));
      archivedList.querySelectorAll('.proj-del').forEach(b=>b.addEventListener('click',e=>{
        e.stopPropagation();
        App.confirmModal('确认删除该项目？',()=>{
          App.Store.setProjects(App.Store.getProjects().filter(x=>x.id!==b.dataset.id));
          renderGantt();renderList();App.showToast('已删除');
        });
      }));
    }
  }
  function openForm(project){
    const isEdit=!!project;
    const p=project||{title:'',category:'work',startDate:App.Utils.todayStr(),endDate:App.Utils.todayStr(),description:'',tasks:[]};
    App.openModal(isEdit?'编辑项目':'新建项目',`
      <div class="form-row"><label>项目标题</label>
        <div class="row"><input type="text" id="p-title" value="${App.Utils.escapeHtml(p.title)}" placeholder="项目名称">${App.speechBtnHTML('p-title')}</div>

      <div class="form-row"><label>分类</label>
        <select id="p-cat">${getCats().map(c=>`<option value="${c.key}" ${p.category===c.key?'selected':''}>${c.label}</option>`).join('')}</select>

      wrap.appendChild(div);

      const title=document.getElementById('p-title').value.trim();
      if(!title){App.showToast('请填写项目标题');return}
      const tasks=[];
      document.querySelectorAll('#p-tasks .row').forEach(row=>{
        const date=row.querySelector('.pt-date').value;
        const ttitle=row.querySelector('.pt-title').value.trim();
        const done=row.querySelector('.pt-done').checked;
        if(date&&ttitle)tasks.push({id:App.Utils.generateUUID(),date,title:ttitle,completed:done});
      });
      const data={
        title,
        category:document.getElementById('p-cat').value,
        color:document.getElementById('p-color').value,
        startDate:document.getElementById('p-start').value,
        endDate:document.getElementById('p-end').value,
        description:document.getElementById('p-desc').value.trim(),
        tasks
      };
      const arr=App.Store.getProjects();
      if(isEdit){
        const idx=arr.findIndex(x=>x.id===project.id);
        Object.assign(arr[idx],data,{updatedAt:new Date().toISOString()});

        arr.push(Object.assign({id:App.Utils.generateUUID(),status:'active',createdAt:new Date().toISOString()},data));
      }
      App.Store.setProjects(arr);
      App.closeModal();renderGantt();renderList();App.showToast(isEdit?'已更新':'已创建');

  function taskRowHTML(t,i){
    return `<div class="row gap4 mb6">
      <input type="date" class="pt-date" style="min-width:120px" value="${t.date||''}">
      <input type="text" class="pt-title" placeholder="任务名" style="flex:1;min-width:0" value="${App.Utils.escapeHtml(t.title||'')}">

  // 分类管理弹窗（此前按钮已挂但函数缺失，导致 render() 抛错使项目不渲染）
  function openCatManage(){
    const s=App.Store.getSettings();
    const cats=getCats();
    const renderRows=()=>cats.map(c=>`
      <div class="row gap6 mb6" data-key="${c.key}">
        <input type="color" class="cat-color" value="${c.color}" ${c.builtin?'disabled':''} style="width:34px;height:34px;border:none;background:none">
        <input type="text" class="cat-label" value="${App.Utils.escapeHtml(c.label)}" ${c.builtin?'readonly':''} style="flex:1;min-width:0">
        ${c.builtin?'<span class="badge badge-optional">内置</span>':'<button class="btn-icon cat-del" style="width:28px;height:28px">×</button>'}
      </div>`).join('');
    App.openModal('分类管理',`
      <p class="muted" style="font-size:var(--f-xs);margin:0 0 8px">内置分类不可删除，自定义分类可改名、改色或删除。</p>
      <div id="cat-rows">${renderRows()}</div>
      <button class="btn btn-ghost btn-sm mt6" id="cat-add">+ 新增分类</button>
      <div class="form-actions"><button class="btn btn-ghost" onclick="App.closeModal()">取消</button><button class="btn btn-primary" id="cat-save">保存</button></div>`);
    const rows=document.getElementById('cat-rows');
    rows.querySelectorAll('.cat-del').forEach(b=>b.addEventListener('click',()=>{
      const k=b.closest('[data-key]').dataset.key;
      const idx=cats.findIndex(x=>x.key===k);
      if(idx>=0){cats.splice(idx,1);rows.innerHTML=renderRows();bindRows()}
    }));
    document.getElementById('cat-add').addEventListener('click',()=>{
      const key='c'+Date.now().toString(36);
      cats.push({key,label:'新分类',color:'#5b8db8'});
      rows.innerHTML=renderRows();bindRows();
    });
    function bindRows(){
      rows.querySelectorAll('.cat-del').forEach(b=>b.addEventListener('click',()=>{
        const k=b.closest('[data-key]').dataset.key;
        const idx=cats.findIndex(x=>x.key===k);
        if(idx>=0){cats.splice(idx,1);rows.innerHTML=renderRows();bindRows()}
      }));
    }
    document.getElementById('cat-save').addEventListener('click',()=>{
      const custom=cats.filter(c=>!c.builtin).map(c=>{
        const row=rows.querySelector(`[data-key="${c.key}"]`);
        return {key:c.key,label:row.querySelector('.cat-label').value.trim()||c.label,color:row.querySelector('.cat-color').value};
      });
      const next=Object.assign({},s,{customProjectCats:custom});
      App.Store.setSettings(next);
      App.closeModal();renderGantt();renderList();App.showToast('分类已保存');
    });
  }
  // 根因修复：路由第二次进入视图时只调用 onShow()，原模块缺失 onShow 导致项目不重绘而“消失”。
  // 这里仅重绘日历与列表（数据已是最新），不重建整个面板，避免重复绑定事件。
  function onShow(){renderGantt();renderList();}
  return {render,onShow};
})();

/* ============ 每日小事 Daily ============ */
App.Modules.Daily = (function(){
  let currentDate=App.Utils.todayStr();
  let habitWeekStart=(function(d){const day=d.getDay();const diff=(day===0)?-6:(1-day);d.setDate(d.getDate()+diff);return d;})(new Date());
  const DEFAULT_HABITS=[
    {key:'weight',label:'体重',type:'number',unit:'kg',builtin:true,color:'#84a59d'},
    {key:'mood',label:'心情',type:'mood',builtin:true,color:'#f15bb5'}
  ];
  const HABIT_COLORS=['#f4a261','#9b5de5','#00bbf9','#f15bb5','#fee440','#00f5d4','#c4a77d','#84a59d','#f28482'];
  function getHabits(){
    const s=App.Store.getSettings();
    const custom=s.customHabits||[];
    return DEFAULT_HABITS.concat(custom.map((h,i)=>({...h,color:h.color||HABIT_COLORS[(DEFAULT_HABITS.length+i)%HABIT_COLORS.length]})));
  }
  function getCustomHabits(){return getHabits().filter(h=>!h.builtin&&h.type==='check');}
  function saveCustomHabits(arr){App.Store.setSettings({customHabits:arr});}
  function getMoodColor(key){const m=MOODS.find(x=>x.key===key);return m?m.color:'#ccc';}
  const MOODS=[
    {key:'relaxed',label:'舒心',color:'#6db86d'},
    {key:'joyful',label:'愉悦',color:'#5b8db8'},
    {key:'plain',label:'平淡',color:'#e0b878'},
    {key:'irritated',label:'烦躁',color:'#c45b5b'},
    {key:'tired',label:'疲惫',color:'#999'}
  ];
  function render(){
    const panel=document.getElementById('view-daily');
    panel.innerHTML=`
      <div class="date-picker">
        <button class="btn-icon" id="d-prev">‹</button>
        <span class="date-text" id="d-date"></span>
        <button class="btn-icon" id="d-next">›</button>
        <button class="btn-text" id="d-today">今天</button>
        <button class="btn btn-ghost btn-sm" id="d-stats">📊 月度统计</button>
      </div>
      <details class="card" open><summary>习惯打卡 <span class="count" id="habit-count">0/0</span></summary>
        <div class="card-body">
          <div class="habits-grid" id="habits-grid"></div>
          <div class="habit-manage-row"><button class="btn btn-ghost btn-sm" id="habit-manage">⚙ 管理习惯项目</button></div>
        </div>
      </details>
      <details class="card" open><summary>灵感速记 <span class="count" id="qn-count">0</span></summary>
        <div class="card-body">
          <div class="row mb6"><input type="text" id="qn-input" placeholder="速记一条灵感…" style="flex:1;min-width:0">${App.speechBtnHTML('qn-input')}<button class="btn btn-primary btn-sm" id="qn-add">＋</button></div>
          <div class="quick-notes-list" id="qn-list"></div>
        </div>
      </details>`;
    document.getElementById('d-prev').addEventListener('click',()=>shiftDay(-1));
    document.getElementById('d-next').addEventListener('click',()=>shiftDay(1));
    document.getElementById('d-today').addEventListener('click',()=>{currentDate=App.Utils.todayStr();renderDay()});
    document.getElementById('d-stats').addEventListener('click',openMonthlyStats);
    panel.addEventListener('click',(e)=>{
      const btn=e.target.closest('#qn-add');if(btn){e.preventDefault();e.stopPropagation();addQuickNote();return}
    });
    panel.addEventListener('keydown',(e)=>{
      if(e.target.id==='qn-input'&&e.key==='Enter'){e.preventDefault();addQuickNote()}
    });
    document.getElementById('habit-manage').addEventListener('click',openHabitManage);
    App.bindSpeechBtns();
    renderDay();
  }
  function shiftDay(delta){
    const d=App.Utils.parseDate(currentDate);d.setDate(d.getDate()+delta);
    currentDate=App.Utils.formatDate(d);renderDay();
  }
  function renderDay(){
    document.getElementById('d-date').textContent=`${currentDate} 周${App.Utils.weekStr(App.Utils.parseDate(currentDate))}`;
    renderQuickNotes();renderHabits();
  }
  function getEntry(){return App.Store.getDaily(currentDate)}
  function saveEntry(e){App.Store.setDaily(currentDate,e)}
  function renderQuickNotes(){
    const e=getEntry();const list=e.quickNotes||[];
    document.getElementById('qn-count').textContent=list.length;
    document.getElementById('qn-list').innerHTML=list.map(n=>`
      <div class="quick-note-item"><span>💡</span><span class="qn-text">${App.Utils.escapeHtml(n.content)}</span>
        <button class="btn-icon qn-del" data-id="${n.id}" style="width:28px;height:28px;font-size:12px">×</button></div>`).join('')||'<div class="empty-state" style="padding:12px">暂无速记</div>';
    document.querySelectorAll('.qn-del').forEach(b=>b.addEventListener('click',()=>{
      const e=getEntry();e.quickNotes=e.quickNotes.filter(n=>n.id!==b.dataset.id);saveEntry(e);renderQuickNotes();
    }));
  }
  function addQuickNote(){
    const input=document.getElementById('qn-input');const v=input.value.trim();if(!v)return;
    const e=getEntry();e.quickNotes=e.quickNotes||[];e.quickNotes.push({id:App.Utils.generateUUID(),content:v,createdAt:new Date().toISOString()});
    saveEntry(e);input.value='';renderQuickNotes();
  }
  function renderTasks(){
    const e=getEntry();const tasks=e.tasks||[];
    document.getElementById('task-count').textContent=tasks.length;
    document.getElementById('task-list').innerHTML=tasks.map(t=>`
      <div class="task-item ${t.type} ${t.type==='todo'&&t.completed?'completed':''}" data-id="${t.id}">
        <span class="task-icon ${t.type==='todo'?'task-check':''} ${t.type==='todo'&&t.completed?'checked':''}">${t.type==='todo'?(t.completed?'✓':''):'📌'}</span>
        <span class="task-content" ${t.type==='todo'?`style="cursor:pointer"`:''}>${App.Utils.escapeHtml(t.content)}</span>
        <button class="btn-icon task-del" data-id="${t.id}" style="width:28px;height:28px;font-size:12px">×</button>
      </div>`).join('')||'<div class="empty-state" style="padding:12px">暂无事项</div>';
    document.querySelectorAll('.task-item.todo').forEach(el=>el.addEventListener('click',()=>{
      const id=el.dataset.id;const e=getEntry();
      const t=e.tasks.find(x=>x.id===id);t.completed=!t.completed;saveEntry(e);renderTasks();
    }));
    document.querySelectorAll('.task-del').forEach(b=>b.addEventListener('click',e=>{
      e.stopPropagation();const en=getEntry();en.tasks=en.tasks.filter(x=>x.id!==b.dataset.id);saveEntry(en);renderTasks();
    }));
  }
  function addTask(){
    const input=document.getElementById('task-input');const v=input.value.trim();if(!v)return;
    const type=document.getElementById('task-type').value;
    const e=getEntry();e.tasks=e.tasks||[];
    e.tasks.push({id:App.Utils.generateUUID(),type,content:v,completed:false,createdAt:new Date().toISOString()});
    saveEntry(e);input.value='';renderTasks();
  }
  function renderHabits(){
    const entry=getEntry();const habits=entry.habits||[];
    const findH=k=>habits.find(h=>h.habitKey===k);
    const grid=document.getElementById('habits-grid');
    const customList=getCustomHabits();
    const dailyAll=App.Store.getDailyAll();
    const DOW=['一','二','三','四','五','六','日'];
    const weekDates=[];for(let i=0;i<7;i++){const dt=new Date(habitWeekStart);dt.setDate(habitWeekStart.getDate()+i);weekDates.push(App.Utils.formatDate(dt));}
    const isDone=(key,date)=>{const en=dailyAll[date];if(!en)return false;return (en.habits||[]).some(h=>h.habitKey===key);};
    let html='';
    // 周历导航
    html+=`<div class="habit-week-bar">
      <button class="btn-icon" id="habit-week-prev">‹</button>
      <span class="habit-week-range">${weekDates[0].slice(5).replace('-','/')} – ${weekDates[6].slice(5).replace('-','/')}</span>
      <button class="btn-icon" id="habit-week-next">›</button>
    </div>`;
    // 自定义项目周历行
    if(customList.length){
      html+='<div class="habit-week-rows">';
      customList.forEach(h=>{
        const color=h.color||'#999';
        html+=`<div class="habit-card habit-check-row" data-key="${h.key}">
          <span class="habit-row-label">${App.Utils.escapeHtml(h.label)}</span>
          <div class="habit-week-dots">${weekDates.map((date,i)=>`<button class="habit-dot ${isDone(h.key,date)?'done':''}" data-key="${h.key}" data-date="${date}" title="${date}" style="${isDone(h.key,date)?`background:${color};border-color:${color}`:''}">${DOW[i]}</button>`).join('')}</div>
        </div>`;
      });
      html+='</div>';
    }else{
      html+='<div class="empty-state" style="padding:12px">暂无打卡项目，点击下方管理添加</div>';
    }
    // 月历
    html+=renderCalendarHTML();
    // 体重 + 心情 同一排
    const weightRec=findH('weight');
    const moodRec=findH('mood');
    const moodColor=moodRec?getMoodColor(moodRec.mood):'';
    html+=`<div class="habit-bottom-row habit-wm-row">
      <div class="habit-wm-item">
        <span class="habit-row-label">体重</span>
        <div class="habit-weight-wrap">
          <input type="number" id="habit-weight" class="habit-weight-input" placeholder="0" step="0.1" value="${weightRec?weightRec.value:''}"><span class="habit-unit">kg</span>
        </div>
      </div>
      <div class="habit-wm-item">
        <span class="habit-row-label">心情</span>
        <select id="habit-mood" class="habit-mood-select">
          <option value="">选择</option>
          ${MOODS.map(m=>`<option value="${m.key}" ${moodRec&&moodRec.mood===m.key?'selected':''}>${m.label}</option>`).join('')}
        </select>
        ${moodColor?`<span class="habit-mood-color" style="background:${moodColor}"></span>`:''}
      </div>
    </div>`;
    html+=`<div id="mood-note-wrap" style="${moodRec&&moodRec.mood?'display:flex':'display:none'};margin-top:8px">
      <input type="text" id="mood-note" placeholder="心情简短备注…" style="font-size:var(--f-xs);flex:1" value="${moodRec&&moodRec.moodNote?App.Utils.escapeHtml(moodRec.moodNote):''}">${App.speechBtnHTML('mood-note')}
    </div>`;
    grid.innerHTML=html;
    // 周历翻页
    document.getElementById('habit-week-prev').addEventListener('click',()=>{habitWeekStart.setDate(habitWeekStart.getDate()-7);renderHabits();});
    document.getElementById('habit-week-next').addEventListener('click',()=>{habitWeekStart.setDate(habitWeekStart.getDate()+7);renderHabits();});
    // 项目圆点打卡
    grid.querySelectorAll('.habit-dot').forEach(b=>b.addEventListener('click',()=>{
      const key=b.dataset.key;const date=b.dataset.date;
      const en=App.Store.getDaily(date);en.habits=en.habits||[];
      const idx=en.habits.findIndex(h=>h.habitKey===key);
      if(idx>=0)en.habits.splice(idx,1);else en.habits.push({id:App.Utils.generateUUID(),habitKey:key,date});
      App.Store.setDaily(date,en);renderHabits();updateHabitCount();
    }));
    // 月历翻页与日期选择
    const calPrev=grid.querySelector('.cal-prev');
    const calNext=grid.querySelector('.cal-next');
    if(calPrev)calPrev.addEventListener('click',()=>{const d=App.Utils.parseDate(currentDate);d.setMonth(d.getMonth()-1);currentDate=App.Utils.formatDate(d);renderDay();});
    if(calNext)calNext.addEventListener('click',()=>{const d=App.Utils.parseDate(currentDate);d.setMonth(d.getMonth()+1);currentDate=App.Utils.formatDate(d);renderDay();});
    grid.querySelectorAll('.cal-cell[data-date]').forEach(c=>c.addEventListener('click',()=>{currentDate=c.dataset.date;renderDay();}));
    // 体重输入
    const weightEl=document.getElementById('habit-weight');
    if(weightEl)weightEl.addEventListener('change',e=>{
      const v=e.target.value;const en=getEntry();en.habits=en.habits||[];
      let rec=en.habits.find(h=>h.habitKey==='weight');
      if(!v){en.habits=en.habits.filter(h=>h.habitKey!=='weight');saveEntry(en);updateHabitCount();return}
      if(!rec){rec={id:App.Utils.generateUUID(),habitKey:'weight',date:currentDate};en.habits.push(rec)}
      rec.value=parseFloat(v);saveEntry(en);updateHabitCount();
    });
    // 心情选择
    const moodEl=document.getElementById('habit-mood');
    if(moodEl)moodEl.addEventListener('change',e=>{
      const mood=e.target.value;const en=getEntry();en.habits=en.habits||[];
      let rec=en.habits.find(h=>h.habitKey==='mood');
      if(!mood){en.habits=en.habits.filter(h=>h.habitKey!=='mood');saveEntry(en);renderHabits();updateHabitCount();return}
      if(!rec){rec={id:App.Utils.generateUUID(),habitKey:'mood',date:currentDate};en.habits.push(rec)}
      rec.mood=mood;saveEntry(en);renderHabits();updateHabitCount();
    });
    // 心情备注
    const moodNoteEl=document.getElementById('mood-note');
    if(moodNoteEl)moodNoteEl.addEventListener('input',e=>saveMoodNote(e.target.value));
    updateHabitCount();
    App.bindSpeechBtns(grid);
  }
  function updateHabitCount(){
    const entry=getEntry();const done=(entry.habits||[]).map(h=>h.habitKey);
    const customList=getCustomHabits();
    const cnt=customList.filter(h=>done.includes(h.key)).length;
    const el=document.getElementById('habit-count');
    if(el)el.textContent=`${cnt}/${customList.length}`;
  }
  // 月历视图：体重+心情（返回 HTML 字符串，由 renderHabits 拼接）
  function renderCalendarHTML(){
    const dailyAll=App.Store.getDailyAll();
    const d=App.Utils.parseDate(currentDate);
    let calYear=d.getFullYear(),calMonth=d.getMonth();
    const firstDay=new Date(calYear,calMonth,1);
    const daysInMonth=new Date(calYear,calMonth+1,0).getDate();
    const startWeekday=firstDay.getDay();
    const padBefore=(startWeekday===0)?6:startWeekday-1;
    const today=App.Utils.todayStr();
    const getDayData=dateStr=>{
      const en=dailyAll[dateStr];if(!en)return null;
      const hs=en.habits||[];
      const weightRec=hs.find(h=>h.habitKey==='weight');
      const moodRec=hs.find(h=>h.habitKey==='mood');
      return {weight:weightRec?weightRec.value:null,mood:moodRec?moodRec.mood:null};
    };
    let cells='';
    const weekHeads=['一','二','三','四','五','六','日'];
    cells+=weekHeads.map(w=>`<div class="cal-head">${w}</div>`).join('');
    for(let i=0;i<padBefore;i++)cells+=`<div class="cal-cell empty"></div>`;
    for(let day=1;day<=daysInMonth;day++){
      const dateStr=`${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
      const data=getDayData(dateStr);
      let diffHtml='';
      if(data&&data.weight!=null){
        const yd=new Date(calYear,calMonth, day-1);
        const yStr=App.Utils.formatDate(yd);
        const yData=getDayData(yStr);
        if(yData&&yData.weight!=null){
          const diff=Math.round((data.weight-yData.weight)*10)/10;
          if(diff!==0){
            const up=diff>0;
            diffHtml=`<span class="cal-diff ${up?'up':'down'}">${Math.abs(diff).toFixed(1)}${up?'↑':'↓'}</span>`;
          }
        }
      }
      const moodDot=data&&data.mood?`<span class="cal-dot" style="background:${getMoodColor(data.mood)}"></span>`:'';
      const dots=moodDot?`<div class="cal-dots">${moodDot}</div>`:'';
      const weightHtml=data&&data.weight!=null?`<span class="cal-weight">${data.weight}</span>`:'';
      const isToday=dateStr===today;
      cells+=`<div class="cal-cell ${isToday?'today':''}" data-date="${dateStr}">
        <span class="cal-date">${day}</span>
        ${weightHtml}
        ${diffHtml}
        ${dots}
      </div>`;
    }
    return `
      <div class="cal-nav">
        <button class="btn-icon cal-prev">‹</button>
        <span class="cal-title">${calYear}年${calMonth+1}月</span>
        <button class="btn-icon cal-next">›</button>
      </div>
      <div class="calendar-grid">${cells}</div>
      <div class="cal-legend">
        ${MOODS.map(m=>`<span><span class="cal-dot" style="background:${m.color}"></span>${m.label}</span>`).join('')}
      </div>`;
  }
  function saveMoodNote(v){
    const e=getEntry();let rec=(e.habits||[]).find(h=>h.habitKey==='mood');
    if(!rec)return;rec.moodNote=v;saveEntry(e);
  }
  function openHabitManage(){
    const custom=getCustomHabits();
    App.openModal('管理习惯项目',`
      <p class="fs-xs c-3 mb6">添加自定义打卡项，点击色块可修改颜色。</p>
      <div id="habit-mgmt-list">${custom.map(h=>`
        <div class="row gap4 mb6 habit-mgmt-item" data-key="${h.key}" data-color="${h.color||HABIT_COLORS[0]}">
          <input type="text" value="${App.Utils.escapeHtml(h.label)}" class="hm-label" style="flex:1">
          <input type="color" class="hm-color" value="${h.color||HABIT_COLORS[0]}" style="width:40px;height:32px;border:none;background:transparent">
          <button class="btn-icon hm-del" style="width:32px;height:32px">×</button>
        </div>`).join('')}</div>
      <div class="row gap4 mt8">
        <input type="text" id="new-habit-label" placeholder="新习惯名（如：冥想、敷面膜）" style="flex:1">
        <button class="btn btn-primary btn-sm" id="habit-add">添加</button>
      </div>
      <div class="form-actions"><button class="btn btn-primary" id="habit-save-all">完成</button></div>`);
    document.getElementById('habit-add').addEventListener('click',()=>{
      const name=document.getElementById('new-habit-label').value.trim();if(!name){App.showToast('请输入名称');return}
      const color=HABIT_COLORS[Math.floor(Math.random()*HABIT_COLORS.length)];
      const div=document.createElement('div');div.className='row gap4 mb6 habit-mgmt-item';
      div.dataset.key='custom_'+Date.now();div.dataset.color=color;
      div.innerHTML=`<input type="text" value="${App.Utils.escapeHtml(name)}" class="hm-label" style="flex:1"><input type="color" class="hm-color" value="${color}" style="width:40px;height:32px;border:none;background:transparent"><button class="btn-icon hm-del" style="width:32px;height:32px">×</button>`;
      document.getElementById('habit-mgmt-list').appendChild(div);
      div.querySelector('.hm-del').addEventListener('click',()=>div.remove());
      div.querySelector('.hm-color').addEventListener('input',e=>{div.dataset.color=e.target.value;});
      document.getElementById('new-habit-label').value='';
    });
    document.querySelectorAll('.hm-color').forEach(c=>c.addEventListener('input',e=>{c.closest('.habit-mgmt-item').dataset.color=e.target.value;}));
    document.querySelectorAll('.hm-del').forEach(b=>b.addEventListener('click',()=>b.closest('.habit-mgmt-item').remove()));
    document.getElementById('habit-save-all').addEventListener('click',()=>{
      const next=[];
      document.querySelectorAll('.habit-mgmt-item').forEach((item,i)=>{
        const label=item.querySelector('.hm-label').value.trim();
        if(label)next.push({key:item.dataset.key,label,type:'check',builtin:false,color:item.dataset.color||HABIT_COLORS[i%HABIT_COLORS.length]});
      });
      saveCustomHabits(next);
      App.closeModal();
      renderHabits();App.showToast('已更新');
    });
  }
  function openMonthlyStats(){
    const d=App.Utils.parseDate(currentDate);
    const y=d.getFullYear(),m=d.getMonth()+1;
    const ym=`${y}-${String(m).padStart(2,'0')}`;
    const dailyAll=App.Store.getDailyAll();
    const reflections={quickNotes:[],moodNotes:[],completedTodos:0,totalTodos:0,reminders:0};
    const daysInMonth=new Date(y,m,0).getDate();
    for(let day=1;day<=daysInMonth;day++){
      const ds=`${ym}-${String(day).padStart(2,'0')}`;
      const e=dailyAll[ds];if(!e)continue;
      (e.quickNotes||[]).forEach(n=>{if(n.content)reflections.quickNotes.push({date:ds,content:n.content})});
      (e.tasks||[]).forEach(t=>{
        if(t.type==='todo'){reflections.totalTodos++;if(t.completed)reflections.completedTodos++}
        else if(t.type==='reminder')reflections.reminders++;
      });
      const moodRec=(e.habits||[]).find(h=>h.habitKey==='mood');
      if(moodRec&&moodRec.mood){reflections.moodNotes.push({date:ds,mood:moodRec.mood,note:moodRec.moodNote||''});}
    }
    const spendingTotal=App.Store.getItems().filter(it=>(it.purchaseDate||'').startsWith(ym)).reduce((s,it)=>s+(Number(it.price)||0),0);
    const projectProgress=App.Store.getProjects().filter(p=>p.status==='active').map(p=>{
      const total=(p.tasks||[]).length;
      const done=(p.tasks||[]).filter(t=>t.completed).length;
      return {title:p.title,progress:total?Math.round(done/total*100):0};
    });
    App.openModal(`${y}年${m}月 月度统计`,App.renderReportToHTML({reflections,spendingTotal,projectProgress,yearMonth:ym})+
      `<div class="form-actions"><button class="btn btn-ghost" onclick="App.closeModal()">关闭</button></div>`);
  }
  return {render};
})();

/* ============ 精油小册 Oils ============ */
App.Modules.Oils = (function(){
  function render(){
    const panel=document.getElementById('view-oils');
    panel.innerHTML=`
      <div class="view-header">
        <h2>精油小册</h2>
        <button class="btn btn-ghost btn-sm" id="oils-export">导出CSV</button>
        <button class="btn btn-primary btn-sm" id="oils-add">+ 新增配方</button>
      </div>
      <div id="oils-list"></div>`;
    document.getElementById('oils-add').addEventListener('click',()=>openForm());
    document.getElementById('oils-export').addEventListener('click',exportCSV);
    renderList();
  }
  function normalizeIngredients(val,components){
    if(Array.isArray(components)&&components.length)return components.filter(x=>x&&x.name);
    if(Array.isArray(val))return val.filter(x=>x&&x.name);
    if(typeof val==='string'&&val){
      return val.split(/\r?\n|,|，/).map(s=>s.trim()).filter(Boolean).map(s=>{
        const m=s.match(/^(.+?)\s*[\-:]?\s*(\d+(?:\.\d+)?)\s*(滴|ml|drops?)?$/i);
        if(m)return{name:m[1].trim(),dose:m[2],unit:(m[3]||'滴').replace(/drops?/i,'滴').replace(/^ml$/i,'ml')};
        return{name:s,dose:'',unit:'滴'};
      });
    }
    return [];
  }
  function renderList(){
    const list=document.getElementById('oils-list');
    const oils=App.Store.getOils();
    if(!oils.length){list.innerHTML='<div class="empty-state"><div class="es-icon">🌿</div>暂无配方，点击右上角新增</div>';return}
    oils.sort((a,b)=>(b.updatedAt||'').localeCompare(a.updatedAt||''));
    list.innerHTML=oils.map(o=>{
      const ings=normalizeIngredients(o.ingredients,o.components);
      return `<div class="oil-card" data-id="${o.id}">
        <div class="row">
          <div class="oc-title flex1">${App.Utils.escapeHtml(o.title)}</div>
          <button class="btn-icon oil-edit" data-id="${o.id}" style="width:28px;height:28px;font-size:13px">✏️</button>
          <button class="btn-icon oil-del" data-id="${o.id}" style="width:28px;height:28px;font-size:13px">×</button>
        </div>
        <div class="oc-ingredients">${ings.length?`<table class="oil-table"><tr><th>精油</th><th>剂量</th><th>单位</th></tr>${ings.map(i=>`<tr><td>${App.Utils.escapeHtml(i.name)}</td><td>${App.Utils.escapeHtml(i.dose||'-')}</td><td>${App.Utils.escapeHtml(i.unit||'滴')}</td></tr>`).join('')}</table>`:'<span class="c-3">未填写配方</span>'}</div>
        ${o.note?`<div class="oc-note">📝 ${App.Utils.escapeHtml(o.note)}</div>`:''}
      </div>`;
    }).join('');
    list.querySelectorAll('.oil-edit').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();const o=oils.find(x=>x.id===b.dataset.id);if(o)openForm(o)}));
    list.querySelectorAll('.oil-del').forEach(b=>b.addEventListener('click',e=>{
      e.stopPropagation();
      App.confirmModal('确认删除该配方？',()=>{
        App.Store.setOils(App.Store.getOils().filter(x=>x.id!==b.dataset.id));
        renderList();App.showToast('已删除');
      });
    }));
  }
  function openForm(oil){
    const isEdit=!!oil;
    const ings=normalizeIngredients(oil?oil.ingredients:'');
    const o=oil||{title:'',ingredients:[],note:''};
    App.openModal(isEdit?'编辑配方':'新增配方',`
      <div class="form-row"><label>配方标题</label>
        <div class="row"><input type="text" id="o-title" value="${App.Utils.escapeHtml(o.title)}" placeholder="如：舒缓助眠油">${App.speechBtnHTML('o-title')}</div>
      </div>
      <div class="form-row"><label>配方内容（精油条目）</label>
        <div id="o-ingredients">${ings.map(i=>ingredientRowHTML(i)).join('')}</div>
        <div class="row gap4 mt6">
          <button class="btn btn-ghost btn-sm" id="o-add-ing">+ 添加精油</button>
          <button class="btn btn-ghost btn-sm" id="o-ocr-btn">📷 截图识别</button>
          <input type="file" id="o-ocr-file" accept="image/*" style="display:none">
        </div>
        <div id="o-ocr-progress" class="fs-xs c-3 mt6"></div>
        <p class="fs-xs c-3 mt6">每行可手填：<b>名称 剂量 单位</b>（如"薰衣草 3 滴"），单位可选滴或ml。截图识别后会自动解析。</p>
      </div>
      <div class="form-row"><label>备注（可选）</label>
        <div class="row"><input type="text" id="o-note" value="${App.Utils.escapeHtml(o.note||'')}" placeholder="如：睡前使用">${App.speechBtnHTML('o-note')}</div>
      </div>
      <div class="form-actions">
        <button class="btn btn-ghost" onclick="App.closeModal()">取消</button>
        <button class="btn btn-primary" id="o-save">保存</button>
      </div>`);
    App.bindSpeechBtns();
    document.getElementById('o-add-ing').addEventListener('click',()=>{
      const wrap=document.getElementById('o-ingredients');
      const div=document.createElement('div');
      div.innerHTML=ingredientRowHTML({name:'',dose:'',unit:'滴'});
      wrap.appendChild(div);
      div.querySelector('.oi-del').addEventListener('click',()=>div.remove());
      App.bindSpeechBtns(div);
    });
    document.querySelectorAll('.oi-del').forEach(b=>b.addEventListener('click',()=>b.closest('.row').remove()));
    document.getElementById('o-ocr-btn').addEventListener('click',()=>document.getElementById('o-ocr-file').click());
    document.getElementById('o-ocr-file').addEventListener('change',async (e)=>{
      const file=e.target.files[0];if(!file)return;
      const prog=document.getElementById('o-ocr-progress');
      prog.textContent='正在加载OCR引擎…';
      try{
        const text=await App.OCR.recognize(file,p=>prog.textContent=`识别中… ${Math.round(p*100)}%`);
        const parsed=normalizeIngredients(text);
        if(parsed.length){
          const wrap=document.getElementById('o-ingredients');
          parsed.forEach(i=>{wrap.insertAdjacentHTML('beforeend',ingredientRowHTML(i));});
          prog.textContent=`识别完成，已添加 ${parsed.length} 条精油`;
        }else prog.textContent='未识别到精油条目，请手动填写';
      }catch(err){prog.textContent='OCR失败：'+err.message}
    });
    document.getElementById('o-save').addEventListener('click',()=>{
      const data={
        title:document.getElementById('o-title').value.trim(),
        ingredients:[],
        note:document.getElementById('o-note').value.trim()
      };
      document.querySelectorAll('#o-ingredients .row').forEach(row=>{
        const name=row.querySelector('.oi-name').value.trim();
        if(!name)return;
        data.ingredients.push({
          name,
          dose:row.querySelector('.oi-dose').value.trim(),
          unit:row.querySelector('.oi-unit').value
        });
      });
      if(!data.title){App.showToast('请填写配方标题');return}
      if(!data.ingredients.length){App.showToast('请至少添加一条精油');return}
      const arr=App.Store.getOils();
      if(isEdit){const idx=arr.findIndex(x=>x.id===oil.id);Object.assign(arr[idx],data,{updatedAt:new Date().toISOString()})}
      else{arr.push(Object.assign({id:App.Utils.generateUUID(),createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()},data))}
      App.Store.setOils(arr);
      App.closeModal();renderList();App.showToast(isEdit?'已更新':'已保存');
    });
  }
  function ingredientRowHTML(i){
    return `<div class="row gap4 mb6">
      <input type="text" class="oi-name" value="${App.Utils.escapeHtml(i.name||'')}" placeholder="精油名（如薰衣草）" style="flex:1;min-width:0">${App.speechBtnHTML('oi-name')}
      <input type="text" class="oi-dose" value="${App.Utils.escapeHtml(i.dose||'')}" placeholder="剂量" style="width:56px;flex:none">
      <select class="oi-unit" style="width:auto;min-width:56px">
        <option value="滴" ${i.unit==='滴'?'selected':''}>滴</option>
        <option value="ml" ${i.unit==='ml'?'selected':''}>ml</option>
      </select>
      <button class="btn-icon oi-del" style="width:28px;height:28px">×</button>
    </div>`;
  }
  function exportCSV(){
    const rows=[];
    App.Store.getOils().forEach(o=>{
      const ings=normalizeIngredients(o.ingredients);
      if(ings.length){
        ings.forEach(i=>rows.push({配方标题:o.title,精油:i.name,剂量:i.dose||'',单位:i.unit||'滴',备注:o.note||'',更新时间:(o.updatedAt||'').slice(0,16)}));
      }else{
        rows.push({配方标题:o.title,精油:'',剂量:'',单位:'',备注:o.note||'',更新时间:(o.updatedAt||'').slice(0,16)});
      }
    });
    App.Utils.exportCSV(rows,'精油小册');
  }
  return {render};
})();

  function renderAll(){renderPrompts();renderMaterials();renderPhrases();renderDailyInspiration()}
  // 每日手帐灵感推荐（内置内容池 + 手动刷新，无外部链接）
  const DAILY_TIPS=[
    {text:'试试"时间轴排版"——把一天的时间从早到晚画成一条线，每个时间段用不同颜色标记，一目了然。',tag:'排版技巧'},
    {text:'用和纸胶带做分隔线，既美观又能快速定位到不同区块的内容。',tag:'素材运用'},
    {text:'本月主题："感恩日记"——每天记录3件值得感谢的小事，月底翻看会很有成就感。',tag:'记录方法'},
    {text:'莫兰迪色系（灰调低饱和）让手帐看起来高级又温柔，试试米色、雾霾蓝、豆沙粉搭配。',tag:'配色'},
    {text:'周计划模板：左侧1/3写本周目标，右侧2/3画7天格子，每格分"待办/备忘/心情"三小块。',tag:'模板设计'},
    {text:'写字不好看？打印体+手写标注混合！标题用贴纸或印章，正文用手写小字，既有温度又整洁。',tag:'书写技巧'},
    {text:'季节元素：加入当季贴纸（夏日西瓜/冰淇淋、秋日枫叶/桂花），让手帐更有季节感。',tag:'装饰创意'},
    {text:'每月画一个习惯追踪表（类似热力图），坚持打卡填色，视觉反馈超有动力。',tag:'习惯管理'},
    {text:'把手帐常用工具放在便携收纳袋里，随时随地都能记录灵感。',tag:'工具收纳'},
    {text:'灵感枯竭时翻看旧手帐！以前的自己往往能给你新的启发，也能看到成长轨迹。',tag:'心态调整'},
    {text:'留白也是美——不要把每一页都填满，适当留白让重点更突出。',tag:'排版美学'},
    {text:'月末复盘：完成度最高的3件事、最想改进的1点、下月目标。',tag:'复盘方法'},
    {text:'睡前5分钟：记录今天情绪关键词+明天最重要的1件事。',tag:'时间管理'},
    {text:'用emoji做视觉标记：😊好心情 😰焦虑 💪完成 ⏳进行中 🎯目标',tag:'符号系统'},
    {text:'书影手帐：看完一本书/一部电影后，一页记录书名+一句话感想+推荐指数⭐',tag:'阅读记录'},
  ];
  let dailyTipIndex=-1;
  function renderDailyInspiration(){
    const body=document.getElementById('daily-inspiration-body');
    if(!body)return;
    const today=new Date();
    const dayOfYear=Math.floor((today-new Date(today.getFullYear(),0,0))/86400000);
    if(dailyTipIndex<0)dailyTipIndex=dayOfYear%DAILY_TIPS.length;
    const tip=DAILY_TIPS[dailyTipIndex%DAILY_TIPS.length];
    body.innerHTML=`
      <div style="display:flex;align-items:flex-start;gap:8px;margin-bottom:8px">
        <span style="font-size:20px;flex-shrink:0;line-height:1">🌟</span>
        <div style="flex:1;min-width:0">
          <div style="display:flex;align-items:center;gap:6px;margin-bottom:3px">
            <span style="font-size:var(--f-sm);font-weight:700;color:var(--c-primary)">每日手帐灵感</span>
            <span class="badge badge-optional">${tip.tag}</span>
          </div>
          <p style="margin:0;font-size:var(--f-sm);line-height:1.55;color:var(--text-1)">${tip.text}</p>
        </div>
      </div>
      <div style="display:flex;gap:6px">
        <button class="btn btn-ghost btn-sm" id="di-refresh">🔄 换一条</button>
        <button class="btn btn-ghost btn-sm" id="di-save-tip">💡 存为话题</button>
      </div>`;
    document.getElementById('di-refresh').addEventListener('click',()=>{
      dailyTipIndex=(dailyTipIndex+1)%DAILY_TIPS.length;
      localStorage.setItem('inspiration_last_refresh',new Date().toISOString());
      renderDailyInspiration();
    });
    document.getElementById('di-save-tip').addEventListener('click',()=>{
      const ins=App.Store.getInspiration();ins.prompts=ins.prompts||[];
      ins.prompts.push({id:App.Utils.generateUUID(),title:tip.text,createdAt:new Date().toISOString(),source:'daily_tip'});
      App.Store.setInspiration(ins);
      renderPrompts();App.showToast('已存入灵感清单 ✨');
    });
  }
  function renderPrompts(){
    const ins=App.Store.getInspiration();const ps=ins.prompts||[];
    document.getElementById('prompt-count').textContent=ps.length;
    document.getElementById('prompt-list').innerHTML=ps.map(p=>`
      <div class="prompt-item"><span>💡</span><span class="pi-text">${App.Utils.escapeHtml(p.title)}</span>
        <button class="btn-icon p-del" data-id="${p.id}" style="width:28px;height:28px;font-size:12px">×</button></div>`).join('')||'<div class="empty-state" style="padding:10px">暂无话题</div>';
    document.querySelectorAll('.p-del').forEach(b=>b.addEventListener('click',()=>{
      const ins=App.Store.getInspiration();ins.prompts=ins.prompts.filter(p=>p.id!==b.dataset.id);App.Store.setInspiration(ins);renderPrompts();
    }));
  }
  function addPrompt(){
    const input=document.getElementById('prompt-input');const v=input.value.trim();if(!v)return;
    const ins=App.Store.getInspiration();ins.prompts=ins.prompts||[];ins.prompts.push({id:App.Utils.generateUUID(),title:v,createdAt:new Date().toISOString()});
    App.Store.setInspiration(ins);input.value='';renderPrompts();
  }
  function renderMaterials(){
    const ins=App.Store.getInspiration();const ms=ins.materials||[];
    document.getElementById('material-count').textContent=ms.length;
    const typeMap={voice:'语音',xiaohongshu:'小红书',ocr:'OCR',manual:'手动'};
    document.getElementById('material-list').innerHTML=ms.slice().reverse().map((m,i)=>{
      const idx=ms.length-i;
      return `<div class="material-item" data-id="${m.id}">
        <div class="mi-head">
          <span class="mi-num">素材${idx}</span>
          <span class="mi-type">${typeMap[m.type]||m.type}</span>
          <span class="mi-title">${App.Utils.escapeHtml((m.content||'').replace(/\n/g,' ').slice(0,40))}${(m.content||'').length>40?'…':''}</span>
          <button class="btn-icon m-del" style="background:none;border:none;cursor:pointer">×</button>
        </div>
        <div class="mi-body"><div class="mi-content">${App.Utils.escapeHtml(m.content)}</div></div>
      </div>`;
    }).join('')||'<div class="empty-state" style="padding:10px">暂无素材</div>';
    // 展开/收起
    document.querySelectorAll('.material-item .mi-head').forEach(h=>{
      h.addEventListener('click',function(e){
        if(e.target.classList.contains('m-del'))return;
        this.parentElement.classList.toggle('mi-open');
      });
    });
    // 删除
    document.querySelectorAll('.m-del').forEach(b=>b.addEventListener('click',function(e){
      e.stopPropagation();
      const ins=App.Store.getInspiration();ins.materials=ins.materials.filter(m=>m.id!==this.closest('.material-item').dataset.id);App.Store.setInspiration(ins);renderMaterials();
    }));
  }
  function saveMaterial(data){
    const ins=App.Store.getInspiration();ins.materials=ins.materials||[];
    ins.materials.push(Object.assign({id:App.Utils.generateUUID(),createdAt:new Date().toISOString()},data));
    App.Store.setInspiration(ins);renderMaterials();App.showToast('已保存到素材库');
  }
  function renderPhrases(){
    const ins=App.Store.getInspiration();const ps=ins.phraseHistory||[];
    document.getElementById('phrase-count').textContent=ps.length;
    document.getElementById('phrase-list').innerHTML=ps.slice().reverse().map(p=>`
      <div class="phrase-item">
        <span class="pi-src">${App.Utils.escapeHtml(p.source)}</span>
        <span style="color:var(--text-3)">→</span>
        <span class="pi-tgt">${App.Utils.escapeHtml(p.target)}</span>
        <button class="btn-icon ph-del" data-id="${p.id}" style="width:28px;height:28px;font-size:12px">×</button>
      </div>`).join('')||'<div class="empty-state" style="padding:10px">暂无翻译历史</div>';
    document.querySelectorAll('.ph-del').forEach(b=>b.addEventListener('click',()=>{
      const ins=App.Store.getInspiration();ins.phraseHistory=ins.phraseHistory.filter(p=>p.id!==b.dataset.id);App.Store.setInspiration(ins);renderPhrases();
    }));
  }
  function savePhrase(){
    const src=document.getElementById('tr-src').value.trim();
    const tgt=document.getElementById('tr-tgt').value.trim();
    if(!src||!tgt){App.showToast('原文和译文都不能为空');return}
    const ins=App.Store.getInspiration();ins.phraseHistory=ins.phraseHistory||[];
    ins.phraseHistory.push({id:App.Utils.generateUUID(),source:src,target:tgt,createdAt:new Date().toISOString()});
    App.Store.setInspiration(ins);renderPhrases();App.showToast('已保存');
    document.getElementById('tr-src').value='';document.getElementById('tr-tgt').value='';
  }
  async function fetchXHS(){
    const url=document.getElementById('xhs-url').value.trim();if(!url){App.showToast('请输入链接');return}
    const prog=document.getElementById('ocr-progress');prog.textContent='';
    App.showToast('因平台限制，自动提取多不可用，请直接粘贴正文');
    document.getElementById('xhs-manual').focus();
  }
  async function runOCR(){
    const file=document.getElementById('ocr-file').files[0];if(!file)return;
    const preview=document.getElementById('ocr-preview');
    const prog=document.getElementById('ocr-progress');
    preview.innerHTML=`<img src="${URL.createObjectURL(file)}" style="max-width:100%;border-radius:6px">`;
    prog.textContent='正在加载 OCR 引擎…';
    try{
      const text=await App.OCR.recognize(file,p=>prog.textContent=`识别中… ${Math.round(p*100)}%`);
      document.getElementById('ocr-result').value=text;
      prog.textContent=text?'识别完成':'未识别到文字';
    }catch(e){
      prog.textContent='OCR 失败：'+e.message+'，请手动输入';
    }
  }
  async function doTranslate(){
    const src=document.getElementById('tr-src').value.trim();
    const lang=document.getElementById('tr-lang').value;
    if(!src){App.showToast('请输入原文');return}
    const tgt=document.getElementById('tr-tgt');
    tgt.value='翻译中…';
    const langMap={en:'zh|en',ja:'zh|ja',ko:'zh|ko'};
    const pair=langMap[lang]||'zh|en';
    try{
      const res=await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(src)}&langpair=${pair}`);
      const json=await res.json();
      if(json.responseStatus===200&&json.responseData&&json.responseData.translatedText){
        tgt.value=json.responseData.translatedText;
        App.showToast('翻译完成');
      }else{
        tgt.value='';
        App.showToast('翻译失败，请手动录入译文');
        tgt.focus();
      }
    }catch(e){
      tgt.value='';App.showToast('网络错误：'+e.message+', 请手动录入译文');tgt.focus();
    }
  }
  return {render};
})();

/* ============ 盈亏管理 Profit ============ */
App.Modules.Profit = (function(){
  let currentDate=App.Utils.todayStr();
  let unlocked=false;
  function render(){
    const panel=document.getElementById('view-profit');
    const pwd=App.Store.getSettings().profitPassword;
    if(pwd&&!unlocked){
      panel.innerHTML=`
        <div class="view-header"><h2>盈亏管理</h2></div>
        <div class="card" style="text-align:center;padding:24px 16px">
          <div style="font-size:36px;margin-bottom:10px">🔒</div>
          <div style="font-size:var(--f-sm);color:var(--text-2);margin-bottom:14px">该板块已加密，请输入密码</div>
          <input type="password" id="profit-pwd-input" placeholder="请输入密码" style="margin-bottom:10px;text-align:center" onkeydown="if(event.key==='Enter')document.getElementById('profit-unlock').click()">
          <div><button class="btn btn-primary btn-sm" id="profit-unlock">解锁</button></div>
          <div id="profit-pwd-err" style="color:var(--danger);font-size:var(--f-xs);margin-top:8px;min-height:16px"></div>
        </div>`;
      document.getElementById('profit-unlock').addEventListener('click',()=>{
        const val=document.getElementById('profit-pwd-input').value;
        if(val===pwd){unlocked=true;App.showToast('已解锁');render()}
        else{document.getElementById('profit-pwd-err').textContent='密码错误，请重试'}
      });
      return;
    }
    panel.innerHTML=`
      <div class="view-header"><h2>盈亏管理 ${pwd?'🔒':''}</h2>${pwd?'<button class="btn btn-ghost btn-sm" id="profit-lock">上锁</button>':''}</div>
      <div class="profit-date-picker">
        <button class="btn-icon" id="p-prev">‹</button>
        <span class="date-text" id="p-date"></span>
        <button class="btn-icon" id="p-next">›</button>
        <button class="btn-text" id="p-today">今天</button>
      </div>
      <div class="profit-form compact">
        <div class="profit-input-row">
          <label class="profit-label">基金盈亏</label>
          <input type="number" id="p-fund" placeholder="0" step="0.01">
        </div>
        <div class="profit-input-row">
          <label class="profit-label">股票盈亏</label>
          <input type="number" id="p-stock" placeholder="0" step="0.01">
        </div>
        <input type="text" id="p-note" placeholder="备注（可选）" style="flex:1;min-width:0">
        <button class="btn btn-primary btn-sm" id="p-save">保存</button>
      </div>
      <div class="profit-summary" id="p-summary"></div>
      <div class="view-header"><h3 style="font-size:var(--f-lg)">当日明细</h3></div>
      <div class="profit-list" id="p-list"></div>`;
    if(pwd){document.getElementById('profit-lock').addEventListener('click',()=>{unlocked=false;render()})}
    document.getElementById('p-prev').addEventListener('click',()=>shift(-1));
    document.getElementById('p-next').addEventListener('click',()=>shift(1));
    document.getElementById('p-today').addEventListener('click',()=>{currentDate=App.Utils.todayStr();renderDay()});
    document.getElementById('p-save').addEventListener('click',saveDay);
    renderDay();
  }
  function shift(d){const dt=App.Utils.parseDate(currentDate);dt.setDate(dt.getDate()+d);currentDate=App.Utils.formatDate(dt);renderDay()}
  function renderDay(){
    document.getElementById('p-date').textContent=`${currentDate} 周${App.Utils.weekStr(App.Utils.parseDate(currentDate))}`;
    const e=getEntry();
    document.getElementById('p-fund').value=e.fundProfit||'';
    document.getElementById('p-stock').value=e.stockProfit||'';
    document.getElementById('p-note').value=e.note||'';
    renderList();renderSummary();
  }
  function getEntry(){const e=App.Store.getProfit(currentDate);return Object.assign({date:currentDate,fundProfit:'',stockProfit:'',note:''},e)}
  function saveEntry(e){App.Store.setProfit(currentDate,e)}
  function saveDay(){
    const fund=document.getElementById('p-fund').value;
    const stock=document.getElementById('p-stock').value;
    const note=document.getElementById('p-note').value.trim();
    const e={date:currentDate};
    if(fund!=='')e.fundProfit=parseFloat(fund);
    if(stock!=='')e.stockProfit=parseFloat(stock);
    if(note)e.note=note;
    if(Object.keys(e).length===1){App.showToast('请至少输入一项盈亏');return}
    saveEntry(e);renderDay();App.showToast('已保存');
  }
  function fmtMoney(n){const v=Number(n)||0;return (v>=0?'+':'')+v.toFixed(2)}
  function renderList(){
    const e=getEntry();const el=document.getElementById('p-list');
    const hasData=e.fundProfit!==''||e.stockProfit!==''||e.note;
    if(!hasData){el.innerHTML='<div class="empty-state"><div class="es-icon">📈</div>当日暂无记录</div>';return}
    let html='';
    if(e.fundProfit!=='')html+=`<div class="profit-item"><span class="pi-type">基金</span><span class="pi-name">基金汇总盈亏</span><span class="pi-profit ${Number(e.fundProfit)>=0?'profit-positive':'profit-negative'}">${fmtMoney(e.fundProfit)}</span></div>`;
    if(e.stockProfit!=='')html+=`<div class="profit-item"><span class="pi-type">股票</span><span class="pi-name">股票汇总盈亏</span><span class="pi-profit ${Number(e.stockProfit)>=0?'profit-positive':'profit-negative'}">${fmtMoney(e.stockProfit)}</span></div>`;
    if(e.note)html+=`<div class="profit-item" style="background:transparent;box-shadow:none;border:none;padding:4px 0"><span class="pi-note" style="flex:1">📝 ${App.Utils.escapeHtml(e.note)}</span></div>`;
    el.innerHTML=html;
  }
  function renderSummary(){
    const all=App.Store.getProfitAll();
    const today=currentDate;
    const d=App.Utils.parseDate(today);
    const y=d.getFullYear(),m=d.getMonth()+1;
    const dayOfWeek=d.getDay();const monday=new Date(d);monday.setDate(d.getDate()-(dayOfWeek===0?6:dayOfWeek-1));
    const sunday=new Date(monday);sunday.setDate(monday.getDate()+6);
    const fmt=(date)=>`${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
    const weekStart=fmt(monday),weekEnd=fmt(sunday);
    const ym=`${y}-${String(m).padStart(2,'0')}`;
    let daySum=0,weekSum=0,monthSum=0,yearSum=0;
    Object.keys(all).forEach(date=>{
      const en=all[date];
      const sum=(Number(en.fundProfit)||0)+(Number(en.stockProfit)||0);
      if(date===today)daySum+=sum;
      if(date>=weekStart&&date<=weekEnd)weekSum+=sum;
      if(date.startsWith(ym))monthSum+=sum;
      if(date.startsWith(String(y)))yearSum+=sum;
    });
    const cls=v=>(Number(v)||0)>=0?'profit-positive':'profit-negative';
    document.getElementById('p-summary').innerHTML=`
      <div class="ps-box"><div class="ps-label">今日盈亏</div><div class="ps-num ${cls(daySum)}">${fmtMoney(daySum)}</div></div>
      <div class="ps-box"><div class="ps-label">本周盈亏</div><div class="ps-num ${cls(weekSum)}">${fmtMoney(weekSum)}</div></div>

  function renderChecklistCard(l){

          <input type="text" class="ci-new-input" placeholder="添加条目…" style="flex:1;min-height:32px;font-size:var(--f-sm)">

    document.querySelectorAll('.cl-toggle').forEach(b=>b.addEventListener('click',e=>{

      e.stopPropagation();
      App.confirmModal('确认删除该清单？历史版本也会一并删除。',()=>{

      });
    }));
    document.querySelectorAll('.cl-edit').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();const cl=App.Store.getChecklists();const l=cl.lists.find(x=>x.id===b.dataset.id);if(l)openListForm(l)}));
    document.querySelectorAll('.cl-sync').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();syncToDaily(b.dataset.id)}));
    document.querySelectorAll('.ci-check').forEach(c=>c.addEventListener('click',e=>{
      e.stopPropagation();
      const listId=c.closest('.checklist-card').dataset.id;
      const itemId=c.dataset.id;
      const cl=App.Store.getChecklists();const l=cl.lists.find(x=>x.id===listId);const it=l.items.find(x=>x.id===itemId);
      it.completed=c.checked;
      saveVersion(l);
      l.updatedAt=new Date().toISOString();App.Store.setChecklists(cl);
      App._renderChecklistAll();
    }));
    document.querySelectorAll('.ci-add-btn').forEach(b=>b.addEventListener('click',()=>{
      const card=b.closest('.checklist-card');const listId=b.dataset.id;
      const input=card.querySelector('.ci-new-input');const ess=card.querySelector('.ci-new-essential').checked;
      const v=input.value.trim();if(!v)return;
      const cl=App.Store.getChecklists();const l=cl.lists.find(x=>x.id===listId);
      saveVersion(l);
      l.items.push({id:App.Utils.generateUUID(),content:v,essential:ess,completed:false,sortOrder:l.items.length});
      l.updatedAt=new Date().toISOString();App.Store.setChecklists(cl);
      App._renderChecklistAll();
    }));
    document.querySelectorAll('.ci-new-input').forEach(inp=>inp.addEventListener('keydown',e=>{
      if(e.key==='Enter'){e.preventDefault();inp.closest('.checklist-card').querySelector('.ci-add-btn').click()}
    }));
    document.querySelectorAll('.checklist-items').forEach(container=>initDragSort(container));
  }
  function saveVersion(list){
    list.versionHistory=list.versionHistory||[];
    if(list.versionHistory.length>=20)list.versionHistory.shift();
    list.versionHistory.push({
      versionId:App.Utils.generateUUID(),
      items:JSON.parse(JSON.stringify(list.items)),
      savedAt:new Date().toISOString()
    });
  }
  function initDragSort(container){
    let dragEl=null;
    function getAfter(y){
      const items=[...container.querySelectorAll('.checklist-item:not(.dragging)')];
      return items.reduce((closest,child)=>{
        const box=child.getBoundingClientRect();
        const offset=y-box.top-box.height/2;
        if(offset<0&&offset>closest.offset)return{offset,element:child};
        return closest;
      },{offset:-Infinity}).element;
    }
    container.querySelectorAll('.checklist-item').forEach(item=>{
      item.addEventListener('dragstart',e=>{dragEl=item;item.classList.add('dragging');e.dataTransfer.effectAllowed='move'});
      item.addEventListener('dragend',()=>{
        if(dragEl){dragEl.classList.remove('dragging');dragEl=null;persistOrder(container)}
      });
    });
    container.addEventListener('dragover',e=>{
      e.preventDefault();
      if(!dragEl)return;
      const after=getAfter(e.clientY);
      if(after)container.insertBefore(dragEl,after);else container.appendChild(dragEl);
    });
    // touch 适配
    let touchEl=null;
    container.addEventListener('touchstart',e=>{
      const handle=e.target.closest('.drag-handle');
      if(!handle)return;
      touchEl=handle.closest('.checklist-item');touchEl.classList.add('dragging');
    },{passive:true});
    container.addEventListener('touchmove',e=>{
      if(!touchEl)return;
      const after=getAfter(e.touches[0].clientY);
      if(after)container.insertBefore(touchEl,after);else container.appendChild(touchEl);
    },{passive:true});
    container.addEventListener('touchend',()=>{
      if(touchEl){touchEl.classList.remove('dragging');persistOrder(container);touchEl=null}
    });
  }
  function persistOrder(container){
    const listId=container.closest('.checklist-card').dataset.id;
    const cl=App.Store.getChecklists();const l=cl.lists.find(x=>x.id===listId);
    if(!l)return;
    saveVersion(l);
    const ids=[...container.querySelectorAll('.checklist-item')].map(el=>el.dataset.id);
    l.items.forEach(it=>{it.sortOrder=ids.indexOf(it.id)});
    l.updatedAt=new Date().toISOString();App.Store.setChecklists(cl);
  }
  function openListForm(list){
    const isEdit=!!list;
    const cl=App.Store.getChecklists();
    const l=list||{title:'',folderId:currentFolder==='all'?(cl.folders[0]&&cl.folders[0].id):currentFolder};
    App.openModal(isEdit?'编辑清单':'新建清单',`
      <div class="form-row"><label>清单标题</label>
        <div class="row"><input type="text" id="cl-title" value="${App.Utils.escapeHtml(l.title)}" placeholder="如：周末采购">${App.speechBtnHTML('cl-title')}</div>
