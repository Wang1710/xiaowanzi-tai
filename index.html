<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="小丸子的工作台">
<title>小丸子的工作台</title>
<style>
/* ============ CSS 变量 ============ */
:root{
  --emoji-font: "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",emoji;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --safe-left:env(safe-area-inset-left,0px);
  --safe-right:env(safe-area-inset-right,0px);

  --bg-main:#fff5f7;
  --bg-card:#ffffff;
  --bg-sidebar:#fce8ec;
  --bg-soft:#ffeef2;

  --c-pink:#F5CCD7;--c-blue:#CCE1F5;--c-green:#CCF5CC;--c-yellow:#F5E9CC;--c-purple:#E2CCF5;--c-orange:#F5D5CC;

  --nav-bg-home:#9fbee8;--nav-bg-items:#e8b8a3;--nav-bg-daily:#a3d9a3;
  --nav-bg-projects:#c9b3e0;--nav-bg-oils:#d9a3b8;--nav-bg-inspiration:#e8d2a3;
  --nav-bg-profit:#d49090;--nav-bg-checklist:#9fbee8;--nav-bg-books:#b8a3d9;
  --nav-bg-tasks:#a3d9d9;--nav-bg-moment:#e8c4a3;

  --text:#5a4a4e;
  --text-2:#9a8a8e;
  --text-3:#c0b0b4;
  --border:#f0d8de;
  --danger:#e09090;
  --success:#90d090;
  --warn:#e0c878;

  --cat-work:#8ab4d9;
  --cat-daughter:#d9a3b8;
  --cat-urgent:#c97a7a;
  --cat-normal:#8a7a7e;

  --r-sm:8px;--r-md:12px;--r-lg:16px;--r-xl:20px;
  --shadow:0 2px 6px rgba(90,74,78,.06);
  --shadow-2:0 4px 14px rgba(90,74,78,.10);

  --f-xs:11px;--f-sm:12px;--f-md:13px;--f-lg:14px;--f-xl:16px;--f-2xl:18px;
  --font:"Yuanti SC","Hiragino Maru Gothic ProN","Hiragino Sans GB","PingFang SC","Microsoft YaHei","Noto Sans SC",-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;
}

/* ============ Reset ============ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:var(--font);font-size:var(--f-md);color:var(--text);background:var(--bg-main);
  line-height:1.55;overflow:hidden;-webkit-overflow-scrolling:touch;
  padding:var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left);
  font-weight:500;letter-spacing:.01em;
}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit;outline:none;border:none;background:none}
button{cursor:pointer;touch-action:manipulation}
input,textarea,select{touch-action:manipulation}
ul,ol{list-style:none}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.hidden{display:none!important}

/* ============ 布局 ============ */
#app{display:flex;height:100vh;height:100dvh;overflow:hidden}

/* 左侧菜单 */
#sidebar{
  width:60px;flex-shrink:0;background:var(--bg-sidebar);
  display:flex;flex-direction:column;align-items:center;
  padding:8px 0;border-right:1px solid var(--border);
  transition:width .25s ease,position .25s ease;z-index:100;overflow:hidden;
}
#sidebar.expanded{width:180px;align-items:stretch;padding:8px 6px}
.sidebar-logo{
  width:44px;height:44px;border-radius:var(--r-md);background:var(--c-purple);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;
  margin-bottom:6px;flex-shrink:0;cursor:pointer;transition:transform .15s,opacity .15s;
}
.sidebar-logo:active{transform:scale(.92);opacity:.85}
#sidebar.expanded .sidebar-logo{width:100%;height:42px;font-size:16px;font-weight:700}
.nav-tree{display:flex;flex-direction:column;align-items:center;gap:8px;overflow-y:auto;padding:6px 4px;flex-shrink:0}
.nav-item{
  width:48px;height:48px;border-radius:var(--r-lg);
  display:flex;align-items:center;justify-content:center;gap:8px;
  color:var(--text-2);transition:all .15s;flex-shrink:0;
  background:var(--bg-card);box-shadow:var(--shadow);
}
.nav-item:active{transform:scale(.96);opacity:.9}
.nav-icon{font-size:20px;line-height:1;display:inline-flex;align-items:center;justify-content:center}
.nav-short{display:none}
.nav-item .nav-label{display:none;font-size:var(--f-md);white-space:nowrap;font-weight:500}
#sidebar.expanded .nav-item{width:calc(100% - 16px);height:48px;justify-content:center;padding:0 10px;margin:0 auto;gap:10px}
#sidebar.expanded .nav-icon{font-size:22px}
#sidebar.expanded .nav-label{display:inline}
.nav-item.active{background:var(--bg-soft);color:var(--text);box-shadow:var(--shadow-2)}
.sidebar-footer{
  width:44px;height:44px;border-radius:var(--r-md);
  display:flex;align-items:center;justify-content:center;
  font-size:18px;color:var(--text-2);flex-shrink:0;
}
#sidebar.expanded .sidebar-footer{width:100%}

/* 抽屉遮罩 */
#sidebar-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:99;display:none;
}
#sidebar-overlay.visible{display:block}

/* 主内容区 */
#main-content{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.top-bar{
  display:flex;align-items:center;gap:6px;padding:6px 8px;
  border-bottom:1px solid var(--border);background:var(--bg-main);flex-shrink:0;
}
.search-wrap{flex:1;display:flex;align-items:center;gap:4px;background:var(--bg-card);
  border-radius:var(--r-md);padding:4px 8px;border:1px solid var(--border);min-width:0}
.search-wrap input{flex:1;background:none;border:none;font-size:var(--f-md);min-width:0}
.search-wrap .icon{font-size:14px;color:var(--text-3);flex-shrink:0}
.search-results{
  position:absolute;top:42px;left:48px;right:8px;max-height:60vh;overflow-y:auto;
  background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r-md);
  box-shadow:var(--shadow-2);z-index:50;display:none;
}
.search-results.visible{display:block}
.search-result-item{padding:10px 12px;border-bottom:1px solid var(--border);font-size:var(--f-sm)}
.search-result-item:active{background:var(--bg-soft)}
.search-result-item .sr-module{font-size:var(--f-xs);color:var(--text-3);margin-bottom:2px}
.search-result-item .sr-snippet{color:var(--text)}
.search-result-item .sr-snippet mark{background:var(--c-yellow);border-radius:2px}
.search-empty{padding:16px;text-align:center;color:var(--text-3);font-size:var(--f-sm)}

#view-container{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 10px 24px}
.view-panel{display:none;flex-direction:column;gap:10px}
.view-panel.active{display:flex}
.view-header{display:flex;align-items:center;gap:8px;margin-bottom:2px;flex-wrap:wrap}
.view-header h2{font-size:var(--f-xl);font-weight:700;flex:1;min-width:0}

/* ============ 通用组件 ============ */
.card{
  background:var(--bg-card);border-radius:var(--r-lg);padding:12px 14px;
  box-shadow:var(--shadow);border:1px solid var(--border);
}
.card-header{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.card-header h3{font-size:var(--f-lg);font-weight:700;flex:1;min-width:0}
.card-header .count{font-size:var(--f-xs);color:var(--text-3);background:var(--bg-soft);padding:1px 6px;border-radius:8px}

.btn{min-height:36px;padding:0 14px;border-radius:var(--r-md);font-size:var(--f-md);display:inline-flex;align-items:center;justify-content:center;gap:4px;transition:all .15s;white-space:nowrap}
.btn-primary{background:var(--c-pink);color:var(--text)}
.btn-primary:active{background:#f0b8c4}
.btn-success{background:var(--success);color:#fff}
.btn-danger{background:var(--danger);color:#fff}
.inp-sm{height:32px;border:1px solid var(--border);border-radius:var(--r-sm);padding:0 8px;font-size:var(--f-sm);background:var(--bg-card);color:var(--text);min-width:130px}
.row.col{flex-direction:column;align-items:stretch;gap:8px}
.row.col>.row{align-items:center;gap:6px}
.btn-ghost{background:var(--bg-soft);color:var(--text)}
.btn-ghost:active{background:var(--border)}
.btn-text{background:none;color:var(--text-2);min-height:32px;padding:0 8px;font-size:var(--f-sm)}
.btn-text:active{color:var(--text)}
.btn-icon{
  width:36px;height:36px;border-radius:var(--r-sm);font-size:16px;
  display:inline-flex;align-items:center;justify-content:center;color:var(--text-2);flex-shrink:0;
}
.btn-icon:active{background:rgba(0,0,0,.06)}
.btn-sm{min-height:30px;padding:0 10px;font-size:var(--f-sm)}

input[type=text],input[type=number],input[type=date],input[type=url],input[type=search],select,textarea{
  width:100%;background:var(--bg-main);border:1px solid var(--border);border-radius:var(--r-md);
  padding:8px 10px;font-size:var(--f-md);min-height:36px;
}
textarea{min-height:80px;resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{border-color:var(--c-blue);background:#fff}
input[type=checkbox]{width:20px;height:20px;min-height:20px;accent-color:var(--success);flex-shrink:0}
input[type=color]{width:36px;height:36px;border-radius:var(--r-sm);border:1px solid var(--border);padding:2px}
label{display:block;font-size:var(--f-sm);color:var(--text-2);margin-bottom:4px}
.form-row{margin-bottom:10px}
.form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}

.tag-chip{
  display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:12px;
  font-size:var(--f-xs);background:var(--bg-soft);color:var(--text-2);white-space:nowrap;
}
.tag-chip.active{background:var(--c-purple);color:var(--text)}
.tag-chip:active{opacity:.8}

.badge{display:inline-block;padding:1px 6px;border-radius:6px;font-size:var(--f-xs);font-weight:600}
.badge-essential{background:var(--c-orange);color:var(--text)}
.badge-optional{background:var(--bg-soft);color:var(--text-2)}
.badge-status{padding:2px 8px;border-radius:8px}

/* 模态框 */
#modal-container{position:fixed;inset:0;z-index:200;display:none;align-items:flex-end;justify-content:center}
#modal-container.visible{display:flex}
.modal-overlay{position:absolute;inset:0;background:rgba(0,0,0,.4)}
.modal{
  position:relative;background:var(--bg-card);width:100%;max-width:480px;
  border-radius:var(--r-xl) var(--r-xl) 0 0;padding:16px 16px calc(16px + var(--safe-bottom));
  max-height:88vh;overflow-y:auto;animation:slideUp .25s ease;
}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-header{display:flex;align-items:center;margin-bottom:14px}
.modal-header h3{flex:1;font-size:var(--f-xl);font-weight:700}
.modal-close{width:32px;height:32px;font-size:18px;color:var(--text-3);display:flex;align-items:center;justify-content:center}

/* Toast */
#toast-container{position:fixed;top:calc(var(--safe-top) + 50px);left:50%;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{
  background:rgba(74,74,74,.92);color:#fff;padding:8px 16px;border-radius:var(--r-md);
  font-size:var(--f-sm);box-shadow:var(--shadow-2);animation:toastIn .2s;max-width:90vw;
}
@keyframes toastIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}

/* 语音指示器 */
#speech-indicator{
  position:fixed;top:calc(var(--safe-top) + 8px);right:8px;z-index:250;
  background:var(--danger);color:#fff;padding:5px 12px;border-radius:14px;
  font-size:var(--f-xs);display:none;align-items:center;gap:4px;animation:pulse 1s infinite;
}
#speech-indicator.visible{display:flex}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
.no-speech .speech-btn{display:none!important}

/* 折叠面板 */
details.card{padding:0;overflow:hidden}
details.card>summary{
  list-style:none;padding:12px 14px;font-size:var(--f-lg);font-weight:700;
  display:flex;align-items:center;gap:8px;cursor:pointer;
}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:"▾";margin-left:auto;color:var(--text-3);transition:transform .2s;font-size:12px}
details.card[open]>summary::after{transform:rotate(180deg)}
details.card>.card-body{padding:0 14px 12px}

/* emoji 字体兜底 */
.sidebar-footer,.weather-icon,.nav-icon{font-family:var(--emoji-font),var(--font)}

/* 菜单项卡片颜色可在这里扩展，如需要模块色左侧条 */
/* 各模块马卡龙背景 */
body.view-home{--bg-main:#f0f7ff;--bg-soft:#e6f2ff}
body.view-tasks{--bg-main:#f0fbfa;--bg-soft:#e6f8f7}
body.view-daily{--bg-main:#f0fff0;--bg-soft:#e6ffe6}
body.view-moment{--bg-main:#fff7f0;--bg-soft:#fff0e6}
body.view-projects{--bg-main:#f7f2ff;--bg-soft:#f0e6ff}
body.view-profit{--bg-main:#fff0f0;--bg-soft:#ffe6e6}
body.view-items{--bg-main:#fff5f0;--bg-soft:#ffede6}
body.view-oils{--bg-main:#fff2f6;--bg-soft:#ffe6ee}
body.view-inspiration{--bg-main:#fffbf0;--bg-soft:#fff6e6}
body.view-checklist{--bg-main:#f0f7ff;--bg-soft:#e6f2ff}
body.view-books{--bg-main:#f5f2ff;--bg-soft:#ede6ff}

/* ============ 首页 ============ */

.summary-card .summary-list{display:flex;flex-direction:column;gap:6px}
.summary-list li{font-size:var(--f-sm);display:flex;align-items:center;gap:6px;padding:4px 0;border-bottom:1px dashed var(--border)}
.summary-list li:last-child{border-bottom:none}
.summary-list .num{font-weight:700;color:var(--danger)}
.summary-list .num.zero{color:var(--success)}
.summary-empty{font-size:var(--f-sm);color:var(--text-3);padding:4px 0}
.home-task-list{display:flex;flex-direction:column;gap:4px}
.home-task-item{display:flex;align-items:center;gap:8px;padding:6px 4px;border-radius:var(--r-sm);min-height:32px;cursor:pointer}
.home-task-item.completed .home-task-content{text-decoration:line-through;color:var(--text-3)}
.home-task-check{width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
.home-task-check.todo-check{width:18px;height:18px;border:2px solid var(--text-3);border-radius:4px;color:#fff}
.home-task-check.todo-check.checked{background:var(--c-green);border-color:var(--c-green)}
.home-task-content{flex:1;font-size:var(--f-sm);word-break:break-word}
.home-completed-section{margin-top:6px;border-top:1px dashed var(--border);padding-top:6px}
.home-completed-toggle{display:flex;align-items:center;gap:4px;font-size:var(--f-xs);color:var(--text-3);cursor:pointer;padding:2px 0;user-select:none}
.home-completed-body{display:none}
.home-completed-section.open .home-completed-body{display:flex;flex-direction:column;gap:4px}

/* ============ 书海小藏 Books ============ */
.book-filter{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;-webkit-overflow-scrolling:touch}
.book-filter .bf{flex:none;padding:4px 12px;border-radius:14px;background:var(--bg-card);border:1px solid var(--border);font-size:var(--f-sm);cursor:pointer;white-space:nowrap}
.book-filter .bf.active{background:var(--c-orange);color:var(--text);border-color:var(--c-orange)}
.book-list{display:flex;flex-direction:column;gap:10px}
.book-card{background:var(--bg-card);border-radius:var(--r-md);padding:10px;box-shadow:var(--shadow);border:1px solid var(--border)}
.book-card-top{display:flex;gap:10px}
.book-cover{flex:none;width:64px;height:92px;border-radius:6px;overflow:hidden;background:var(--bg-soft);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;border:1px dashed var(--border)}
.book-cover img{width:100%;height:100%;object-fit:cover;display:block}
.book-cover .cover-ph{font-size:22px;color:var(--text-3)}
.book-cover .cover-upload{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;background:rgba(0,0,0,.35);opacity:0;transition:opacity .15s;pointer-events:none}
.book-cover:hover .cover-upload{opacity:1}
.book-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.book-title-row{display:flex;align-items:flex-start;gap:6px}
.book-title{flex:1;font-size:var(--f-md);font-weight:700;word-break:break-word}
.book-author{font-size:var(--f-xs);color:var(--text-3);margin-top:1px}
.book-del{flex:none;width:28px;height:28px;font-size:14px}
.book-status-row{display:flex;gap:4px;flex-wrap:wrap}
.book-status{flex:none;padding:2px 8px;border-radius:10px;font-size:var(--f-xs);border:1px solid var(--border);background:var(--bg-main);cursor:pointer}
.book-status.active{background:var(--c-purple);color:var(--text);border-color:var(--c-purple)}
.book-stars{display:flex;gap:2px;align-items:center;font-size:16px}
.book-star{cursor:pointer;color:var(--border);line-height:1;transition:transform .1s}
.book-star.on{color:#f5b50a}
.book-star:active{transform:scale(1.2)}
.book-note{width:100%;font-size:var(--f-xs);resize:vertical;min-height:34px;margin-top:8px}
.cover-zoom{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:400}
.cover-zoom.show{display:flex}
.cover-zoom img{max-width:90%;max-height:85%;border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.cover-zoom .cz-tip{position:absolute;bottom:24px;color:#fff;font-size:var(--f-xs);opacity:.8}
.cover-zoom .cz-actions{position:absolute;bottom:56px;display:flex;gap:8px}

/* ============ 物品小集 ============ */
.items-list{display:flex;flex-direction:column;gap:8px}
.item-card{background:var(--bg-card);border-radius:var(--r-md);padding:10px 12px;box-shadow:var(--shadow);border:1px solid var(--border)}
.item-card .item-top{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.item-card .item-name{flex:1;text-align:left;font-size:var(--f-md);font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-card .item-price{font-size:var(--f-md);font-weight:700;color:var(--cat-work);flex:none;margin-right:auto}
.item-card .item-actions{display:flex;align-items:center;gap:2px;flex:none}
.item-card .item-actions .btn-icon{width:28px;height:28px;font-size:14px}
.item-card .item-meta{display:flex;gap:10px;font-size:var(--f-xs);color:var(--text-3)}
.status-在用{background:var(--c-green);color:#5a8a5a}
.status-闲置{background:var(--c-yellow);color:#8a7a4a}
.status-已出{background:var(--bg-soft);color:var(--text-3)}
.status-损坏{background:var(--c-pink);color:#9a5a5a}

/* ============ 每日小事 ============ */
.date-picker{display:flex;align-items:center;gap:6px;justify-content:center;padding:4px}
.date-picker .date-text{flex:1;text-align:center;font-size:var(--f-md);font-weight:500}
.quick-notes-list{display:flex;flex-direction:column;gap:6px}
.quick-note-item{background:var(--bg-main);border-radius:var(--r-sm);padding:6px 10px;font-size:var(--f-sm);display:flex;align-items:center;gap:6px}
.quick-note-item .qn-text{flex:1;word-break:break-word}
.tasks-list{display:flex;flex-direction:column;gap:4px}
.task-item{display:flex;align-items:center;gap:8px;padding:6px 4px;border-radius:var(--r-sm);min-height:36px;border-left:3px solid transparent}
.task-item .task-icon{width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.task-item .task-icon.task-check{width:22px;height:22px;border:2px solid var(--text-3);border-radius:5px;background:transparent;color:#fff;font-size:13px;font-weight:700}
.task-item.todo.completed .task-icon.task-check{background:var(--c-green);border-color:var(--c-green)}
.task-item .task-content{flex:1;font-size:var(--f-sm);word-break:break-word}
.task-item.todo.completed .task-content{text-decoration:line-through;color:var(--text-3)}
.task-item.reminder .task-content{color:var(--text-2)}
.task-item .task-del{font-size:14px;color:var(--text-3);opacity:.5}
.task-item .task-del:active{opacity:1;color:var(--danger)}
.task-content{cursor:pointer}
.task-priority-select,.task-category-select{width:auto;min-width:66px;font-size:var(--f-sm);padding:6px 8px;height:36px;box-sizing:border-box}
.task-priority-select:disabled{opacity:.4}
.task-input-group{display:flex;align-items:center;gap:6px}
.task-input-group #task-input{flex:1;min-width:0;height:36px;min-height:36px;box-sizing:border-box}
#task-add{height:36px;min-height:36px;padding:0 14px;box-sizing:border-box}
.task-priority{font-size:var(--f-xs);color:var(--danger);margin-left:4px}
.task-section{margin-bottom:8px}
.task-section-title{font-size:var(--f-xs);color:var(--text-3);margin:8px 4px 4px}
.task-cat-header{display:flex;align-items:center;gap:6px;font-size:var(--f-xs);color:var(--text-2);margin:6px 4px 2px;font-weight:500}
.task-cat-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.cat-row{display:flex;align-items:center;gap:8px}
.tasks-completed-section{margin-top:8px;border-top:1px dashed var(--border);padding-top:6px}
.tasks-completed-toggle{display:flex;align-items:center;gap:4px;font-size:var(--f-xs);color:var(--text-3);cursor:pointer;padding:2px 0;user-select:none}
.tasks-completed-body{display:none;flex-direction:column;gap:4px}
.tasks-completed-section.open .tasks-completed-body{display:flex}
.tasks-completed-section .tasks-completed-toggle span{transition:transform .2s}
.tasks-completed-section.open .tasks-completed-toggle span{transform:rotate(90deg)}

.habits-grid{display:flex;flex-direction:column;gap:4px}
.habit-tabs{display:flex;gap:6px;margin-bottom:6px}
.habit-tab{flex:1;padding:5px;text-align:center;font-size:var(--f-sm);color:var(--text-2);border-radius:var(--r-md);background:var(--bg-main);border:1px solid var(--border)}
.habit-tab.active{background:var(--bg-card);color:var(--text);font-weight:500;box-shadow:var(--shadow)}
.habit-card{background:var(--bg-main);border-radius:var(--r-md);padding:4px 8px}
.habit-card-header{display:flex;align-items:center;justify-content:space-between;gap:8px}
.habit-card-title{font-size:var(--f-sm);color:var(--text-2);font-weight:500}
.habit-card-body{display:flex;align-items:center;gap:4px}

/* 月历视图 */
.cal-nav{display:flex;align-items:center;justify-content:space-between;padding:2px 0 6px}
.cal-title{font-size:var(--f-md);font-weight:700}
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-head{text-align:center;font-size:var(--f-xs);color:var(--text-3);padding:2px 0}
.cal-cell{border:1px solid var(--border);border-radius:var(--r-sm);padding:3px 2px;min-height:52px;font-size:var(--f-xs);display:flex;flex-direction:column;gap:1px;cursor:pointer;background:var(--bg-card)}
.cal-cell.empty{border:none;background:transparent;cursor:default}
.cal-cell.today{border-color:var(--c-pink);background:#fff0f3;box-shadow:0 0 0 1px var(--c-pink)}
.cal-date{font-weight:700;color:var(--text-2);align-self:flex-start}
.cal-weight{font-weight:700;color:var(--text);font-size:var(--f-xs)}
.cal-diff{font-size:10px;font-weight:700}
.cal-diff.up{color:var(--danger)}
.cal-diff.down{color:var(--success)}
.cal-dots{display:flex;gap:2px;flex-wrap:wrap;margin-top:auto}
.cal-dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none}
.cal-dot-habit{background:var(--cat-work)}
.cal-legend{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;font-size:10px;color:var(--text-2)}
.cal-legend span{display:flex;align-items:center;gap:2px}
.habit-weight-input{width:62px;max-width:62px;flex:none;min-height:34px;height:34px;padding:2px 6px;text-align:center;font-size:var(--f-sm)}
.habit-unit{font-size:var(--f-xs);color:var(--text-3)}
.habit-check-row{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:28px}
.habit-big-num{display:none}
/* 周历打卡导航与项目行 */
.habit-week-bar{display:flex;align-items:center;justify-content:space-between;margin:2px 0 8px}
.habit-week-range{font-size:var(--f-sm);color:var(--text-2);font-weight:500}
.habit-week-rows{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.habit-week-dots{display:flex;gap:4px;flex:none}
.habit-dot{width:22px;height:22px;border-radius:50%;border:1px solid var(--border);background:var(--bg-card);font-size:10px;color:var(--text-3);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .15s,border-color .15s,transform .1s}
.habit-dot:active{transform:scale(.9)}
.habit-dot.done{color:#fff;border-color:transparent;font-weight:700}
.habit-row-label{font-size:var(--f-sm);color:var(--text-2);font-weight:500;flex:1;text-align:left;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 底部：体重 / 心情 */
.habit-bottom-row{display:flex;align-items:center;gap:10px;min-height:32px;margin-top:8px}
.habit-wm-row{display:flex;align-items:center;gap:14px;margin-top:10px}
.habit-wm-item{display:flex;align-items:center;gap:6px;flex:1;min-width:0}
.habit-wm-item .habit-row-label{flex:none;width:34px;white-space:nowrap}
.habit-weight-wrap{display:flex;align-items:center;gap:4px;flex:1;min-width:0}
.habit-mood-select{flex:1;min-width:0;max-width:none;font-size:var(--f-sm);padding:6px 8px;height:34px;box-sizing:border-box}
.habit-mood-color{width:16px;height:16px;border-radius:50%;border:1px solid var(--border);flex:none}
.habit-manage-row{display:flex;justify-content:flex-end;margin-top:6px}
.mood-note{width:100%;min-height:28px;font-size:var(--f-xs)}

/* 月度统计热力图 */
.heatmap-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:6px}
.heatmap{display:grid;grid-template-columns:60px repeat(var(--days,31),1fr);gap:2px;font-size:var(--f-xs);min-width:max-content}
.heatmap .hm-cell{min-width:14px;height:18px;border-radius:3px;background:var(--bg-soft);display:flex;align-items:center;justify-content:center;color:var(--text-3)}
.heatmap .hm-label{background:none;color:var(--text-2);font-size:var(--f-xs);justify-content:flex-start;padding-right:4px}
.heatmap .hm-head{background:none;color:var(--text-3);font-size:10px}
.heatmap .hm-done{background:var(--c-green)}
.heatmap .hm-done.l2{background:#9acc9a}
.heatmap .hm-done.l3{background:#7ab87a}
.heatmap .hm-mood{background:var(--c-yellow)}
.stats-summary{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:10px}
.stats-summary .stat-box{background:var(--bg-main);border-radius:var(--r-sm);padding:8px;text-align:center}
.stats-summary .stat-num{font-size:var(--f-xl);font-weight:700;color:var(--cat-work)}
.stats-summary .stat-label{font-size:var(--f-xs);color:var(--text-3)}

/* ============ 项目小栏 ============ */
.gantt-month-nav{display:flex;align-items:center;gap:8px;justify-content:center;margin-bottom:6px}
.gantt-month-nav .month-text{flex:1;text-align:center;font-size:var(--f-md);font-weight:700}
.gantt-legend{display:flex;gap:8px;flex-wrap:wrap;font-size:var(--f-xs);margin-bottom:6px}
.gantt-legend .lg{display:flex;align-items:center;gap:3px}
.gantt-legend .lg-dot{width:10px;height:10px;border-radius:3px}
.gantt-legend .lg-dot.fluoro{background:color-mix(in srgb, var(--bc) 30%, #ffffff);border:1px solid color-mix(in srgb, var(--bc) 55%, #ffffff);box-shadow:0 0 3px color-mix(in srgb, var(--bc) 45%, transparent)}
.gantt-wrap{border-radius:var(--r-md);background:var(--bg-card);-webkit-overflow-scrolling:touch}
.gantt-calendar{display:grid;border-top:1px solid var(--border);border-left:1px solid var(--border);font-size:var(--f-xs);border-radius:var(--r-sm);overflow:hidden}
.gantt-cell{border-right:1px solid var(--border);border-bottom:1px solid var(--border);min-height:38px;display:flex;align-items:center;justify-content:center;color:var(--text-3);flex-direction:column;position:relative;overflow:hidden}
.gantt-cell.gantt-empty{background:var(--bg-main)}
.gantt-cell.weekend{background:#f8e8ec}
.gantt-cell.today{background:#fff0f3;box-shadow:inset 0 0 0 2px var(--c-pink)}
.gantt-cell.today .gantt-date-num{color:var(--text-1);font-weight:700;font-size:11px}
.gantt-cell.today::after{content:'→';position:absolute;bottom:2px;right:4px;font-size:13px;line-height:1;color:#ff5252;font-weight:700;z-index:4}
.gantt-row-label{background:var(--bg-card);padding:4px 8px;font-size:var(--f-sm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-right:1px solid var(--border);border-bottom:1px solid var(--border);display:flex;align-items:center;font-weight:500;justify-content:flex-start}
.gantt-head{background:var(--bg-soft);border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:4px 8px;font-weight:700;display:flex;align-items:center}
.gantt-head-day{background:var(--bg-soft);font-weight:500;min-height:30px}
.gantt-task{position:absolute;bottom:2px;left:2px;right:2px;height:16px;border-radius:8px;color:#fff;font-size:9px;display:flex;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap;box-shadow:0 1px 2px rgba(0,0,0,.12);z-index:2}
.gantt-calendar.daily .gantt-cell{min-height:32px;position:relative;overflow:hidden}
.gantt-calendar.daily .gantt-head-day{min-height:24px;padding:2px 0}
.gantt-calendar.daily .gantt-head-day .gantt-date-num{position:static;font-size:9px}
.gantt-calendar.daily .gantt-row-label{border-bottom:1px solid var(--border);min-height:32px}
.gantt-calendar.daily .gantt-task{bottom:3px;left:1px;right:1px;height:14px;border-radius:7px;font-size:8px}
.gantt-date-num{position:absolute;top:2px;left:4px;font-size:10px;color:var(--text-3);z-index:3}
.gantt-row{display:contents}

/* 统一甘特图 - 色块直接叠加在月历格子上 */
.gantt-unified{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden;background:var(--bg-card)}
.gantt-unified-header{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--border)}
.gantt-unified-header .gu-head-day{background:var(--bg-soft);padding:6px 2px;font-size:11px;text-align:center;border-right:1px solid var(--border);min-height:28px;display:flex;align-items:center;justify-content:center}
.gantt-unified-header .gu-head-day.weekend{background:#f8e8ec}
.gantt-unified-header .gu-head-day.today{background:#fff0f3;font-weight:700}
.gantt-unified-body{position:relative}
.gantt-week-row{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--border);min-height:64px;position:relative}
.gantt-week-row:last-child{border-bottom:none}
.gantt-week-row .gu-day-cell{border-right:1px solid var(--border);position:relative;min-height:64px;display:flex;flex-direction:column;align-items:flex-end;justify-content:flex-start;padding-bottom:16px}
.gantt-week-row .gu-day-cell.weekend{background:#f8e8ec}
.gantt-week-row .gu-day-cell.today{background:#fff0f3}
.gantt-week-row .gu-day-cell.empty{background:var(--bg-main)}
.gantt-week-row .gu-day-cell .gu-day-num{position:absolute;top:3px;right:4px;font-size:11px;color:var(--text-3);line-height:1;z-index:2}
.gantt-week-row .gu-day-cell .gu-day-num.today-num{color:var(--text);font-weight:700}
/* 跨天色条：横跨整周网格的底部叠加层 */
.gantt-week-row .gu-week-bars{position:absolute;bottom:3px;left:0;right:0;display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:0 2px;z-index:1}
.gantt-week-row .gu-track-bar{height:6px;border-radius:3px;align-self:center;opacity:.9}

/* 项目图例 */
.gantt-legend{display:flex;gap:8px;flex-wrap:wrap;font-size:var(--f-xs);margin-bottom:6px;margin-top:8px}
.gantt-legend .lg{display:flex;align-items:center;gap:4px;font-size:var(--f-xs);padding:2px 8px;background:var(--bg-main);border-radius:10px}
.gantt-legend .lg-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}

.project-card{background:var(--bg-card);border-radius:var(--r-md);padding:10px 12px;box-shadow:var(--shadow);border-left:3px solid var(--cat-normal)}
.project-card.cat-work{border-left-color:var(--cat-work)}
.project-card.cat-daughter{border-left-color:var(--cat-daughter)}
.project-card.cat-urgent{border-left-color:var(--cat-urgent)}
.project-card .pc-top{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.project-card .pc-title{flex:1;font-size:var(--f-md);font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.project-card .pc-meta{font-size:var(--f-xs);color:var(--text-3);display:flex;gap:8px;flex-wrap:wrap}
.project-card .pc-warn{background:var(--c-pink);color:#9a5a5a;padding:1px 6px;border-radius:6px;font-size:var(--f-xs)}
.cat-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

/* ============ 精油小册 ============ */
.oil-card{background:var(--bg-card);border-radius:var(--r-md);padding:10px 12px;box-shadow:var(--shadow);border:1px solid var(--border)}
.oil-card .oc-title{font-size:var(--f-md);font-weight:700;margin-bottom:4px}
.oil-card .oc-ingredients{font-size:var(--f-sm);color:var(--text-2);background:var(--bg-main);padding:6px 8px;border-radius:var(--r-sm);margin-bottom:4px}
.oil-table{width:100%;font-size:var(--f-sm);border-collapse:collapse}
.oil-table th,.oil-table td{padding:4px 6px;text-align:left;border-bottom:1px dashed var(--border)}
.oil-table th{color:var(--text-3);font-weight:500;font-size:var(--f-xs)}
.oil-table td:nth-child(2),.oil-table td:nth-child(3),.oil-table th:nth-child(2),.oil-table th:nth-child(3){text-align:center;color:var(--text-3)}
.oil-card .oc-comp{display:inline-flex;align-items:center;gap:2px;background:var(--bg-card);padding:2px 8px;border-radius:var(--r-sm);border:1px solid var(--border)}
.oil-card .oc-comp b{color:var(--c-green);font-weight:700}
.oil-card .oc-note{font-size:var(--f-xs);color:var(--text-3)}

/* ============ 灵感小站 ============ */
.tab-bar{display:flex;gap:4px;background:var(--bg-soft);border-radius:var(--r-md);padding:3px;margin-bottom:10px}
.tab-bar .tab{flex:1;padding:6px;text-align:center;font-size:var(--f-sm);color:var(--text-2);border-radius:var(--r-sm)}
.tab-bar .tab.active{background:var(--bg-card);color:var(--text);font-weight:500;box-shadow:var(--shadow)}
.tab-panel{display:none}
.tab-panel.active{display:block}

#daily-inspiration-card{background:linear-gradient(135deg,#fef9f0 0%,#f5f0ff 100%);border:1px solid #e8dff5}
#daily-inspiration-card .card-body{padding:10px 12px}

.prompt-item{display:flex;align-items:center;gap:6px;padding:6px 8px;background:var(--bg-main);border-radius:var(--r-sm);margin-bottom:4px;font-size:var(--f-sm)}
.prompt-item .pi-text{flex:1}
.material-item{background:var(--bg-main);border-radius:var(--r-sm);margin-bottom:6px;font-size:var(--f-sm);overflow:hidden;border:1px solid var(--c-border)}
.material-item .mi-head{display:flex;align-items:center;gap:8px;padding:8px 10px;cursor:pointer}
.material-item .mi-num{font-weight:700;color:var(--text-1);flex:none}
.material-item .mi-type{display:inline-block;font-size:var(--f-xs);padding:1px 6px;border-radius:6px;background:var(--c-purple);color:#fff;flex:none}
.material-item .mi-title{flex:1;font-size:var(--f-sm);color:var(--text-1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.material-item .mi-body{display:none;padding:0 10px 8px;border-top:1px dashed var(--c-border)}
.material-item.mi-open .mi-body{display:block}
.material-item .mi-content{white-space:pre-wrap;word-break:break-word;margin-top:4px;color:var(--text-2)}
.material-item .m-del{width:28px;height:28px;font-size:12px;flex:none}

.phrase-item{display:flex;align-items:center;gap:6px;padding:6px 8px;background:var(--bg-main);border-radius:var(--r-sm);margin-bottom:4px;font-size:var(--f-sm)}
.phrase-item .pi-src{flex:1;color:var(--text-2)}
.phrase-item .pi-tgt{flex:1;color:var(--text)}

/* ============ 盈亏管理 ============ */
.profit-date-picker{display:flex;align-items:center;gap:6px;justify-content:center;padding:4px}
.profit-form{display:flex;gap:6px;flex-wrap:wrap;align-items:center;background:var(--bg-main);border-radius:var(--r-md);padding:8px 10px}
.profit-form.compact .profit-input-row{display:flex;align-items:center;gap:6px;flex:1;min-width:120px}
.profit-form.compact .profit-label{font-size:var(--f-sm);color:var(--text-2);white-space:nowrap}
.profit-form.compact input[type="number"]{width:90px;flex:1;min-width:60px}
.profit-form.compact input[type="text"]{flex:1;min-width:80px}
.profit-summary{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0}
.profit-summary .ps-box{background:var(--bg-card);border-radius:var(--r-md);padding:10px;text-align:center;box-shadow:var(--shadow);border:1px solid var(--border)}
.profit-summary .ps-label{font-size:var(--f-xs);color:var(--text-3)}
.profit-summary .ps-num{font-size:var(--f-xl);font-weight:700;margin-top:2px}
.profit-positive{color:#c45b5b}
.profit-negative{color:#5a9a5a}
.profit-list{display:flex;flex-direction:column;gap:6px}
.profit-item{display:flex;align-items:center;gap:8px;background:var(--bg-card);border-radius:var(--r-md);padding:8px 10px;box-shadow:var(--shadow);border:1px solid var(--border)}
.profit-item .pi-type{width:36px;text-align:center;font-size:var(--f-xs);color:var(--text-3);flex-shrink:0}
.profit-item .pi-name{flex:1;font-size:var(--f-sm);font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.profit-item .pi-profit{font-size:var(--f-md);font-weight:700;flex-shrink:0}
.profit-item .pi-note{font-size:var(--f-xs);color:var(--text-3);flex-shrink:0}
.profit-item .pi-actions{display:flex;gap:2px;flex-shrink:0}

/* ============ 清单小盒 ============ */
.folder-nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch;align-items:center}
.folder-nav .folder-chip{flex-shrink:0}
.checklist-card{background:var(--bg-card);border-radius:var(--r-md);padding:10px 12px;box-shadow:var(--shadow);margin-bottom:8px}
.checklist-card .cl-header{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.checklist-card .cl-title{flex:1;font-size:var(--f-md);font-weight:700}
.checklist-items{display:flex;flex-direction:column;gap:2px}
.checklist-item{display:flex;align-items:center;gap:6px;padding:6px 4px;border-radius:var(--r-sm);min-height:36px;background:var(--bg-main)}
.checklist-item.dragging{opacity:.4}
.checklist-item .drag-handle{cursor:grab;color:var(--text-3);font-size:14px;flex-shrink:0;touch-action:none}
.checklist-item .ci-content{flex:1;font-size:var(--f-sm);min-width:0}
.checklist-item.completed .ci-content{text-decoration:line-through;color:var(--text-3)}
.checklist-item .ci-actions{display:flex;gap:2px;opacity:.6}

/* 月度简报 */
.report-section{margin-bottom:10px}
.report-section h4{font-size:var(--f-sm);color:var(--text-2);margin-bottom:4px;font-weight:700}
.report-section .rs-content{font-size:var(--f-sm);background:var(--bg-main);padding:8px;border-radius:var(--r-sm)}
.report-stat{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px dashed var(--border);font-size:var(--f-sm)}
.report-stat:last-child{border-bottom:none}
#monthly-report-card summary{display:flex;align-items:center;justify-content:space-between;gap:8px;cursor:pointer;list-style:none}
#monthly-report-card summary::-webkit-details-marker{display:none}
#monthly-report-card summary::after{content:"▾";margin-left:auto;color:var(--text-3);transition:transform .2s;font-size:12px}
#monthly-report-card[open]>summary::after{transform:rotate(180deg)}
.report-status{font-size:var(--f-xs);color:var(--text-3);font-weight:400}

.empty-state{text-align:center;padding:24px 12px;color:var(--text-3);font-size:var(--f-sm)}
.empty-state .es-icon{font-size:32px;margin-bottom:6px;opacity:.5}

/* 小工具 */
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.flex1{flex:1;min-width:0}
.mt6{margin-top:6px}.mt8{margin-top:8px}.mt10{margin-top:10px}.mt12{margin-top:12px}
.mb6{margin-bottom:6px}.mb8{margin-bottom:8px}
.tc{text-align:center}.tr{text-align:right}

  font-size:40px;color:var(--text-3);background:var(--bg-soft)}
.home-cover .hc-info{padding:8px 12px;display:flex;flex-direction:column;align-items:flex-start;gap:4px}

<script>
window.__errs=[];
window.addEventListener('error',function(e){window.__errs.push((e.error&&e.error.stack)||e.message+' @'+e.lineno+':'+e.colno)});
/* ============================================================
 * 小丸子的工作台  ——  单文件应用
 * 模块组织：Utils → Store → Router → Speech → Weather → Modules → Init
 * ============================================================ */
const App = window.App = {};

/* ============ App.Utils ============ */
App.Utils = (function(){
  function generateUUID(){
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{
      const r=Math.random()*16|0;const v=c==='x'?r:(r&0x3|0x8);return v.toString(16);
    });
  }
  function formatDate(d){
    d=d||new Date();
    const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  }
  function parseDate(s){const d=new Date(s);return isNaN(d)?null:d}
  function todayStr(){return formatDate(new Date())}
  function escapeHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  function debounce(fn,wait){let t;return function(){clearTimeout(t);const args=arguments,ctx=this;t=setTimeout(()=>fn.apply(ctx,args),wait||200)}}
  function loadScript(src){
    return new Promise((res,rej)=>{
      const s=document.createElement('script');s.src=s;s.onload=res;s.onerror=()=>rej(new Error('load fail: '+src));
      document.head.appendChild(s);
    });
  }
  function exportCSV(rows,filename){
    if(!rows||!rows.length){App.showToast('无数据可导出');return}
    const headers=Object.keys(rows[0]);
    const lines=[headers.join(',')];
    rows.forEach(r=>{
      lines.push(headers.map(h=>{
        let v=r[h];
        if(v==null)v='';
        if(typeof v==='object')v=JSON.stringify(v);
        v=String(v).replace(/"/g,'""');
        return `"${v}"`;
      }).join(','));
    });
    const BOM='\uFEFF';
    const blob=new Blob([BOM+lines.join('\n')],{type:'text/csv;charset=utf-8;'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download=`${filename}_${todayStr()}.csv`;
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    App.showToast('已导出 '+filename);
  }
  const WEEK=['日','一','二','三','四','五','六'];
  function weekStr(d){return WEEK[(d||new Date()).getDay()]}
  return {generateUUID,formatDate,parseDate,todayStr,escapeHtml,debounce,loadScript,exportCSV,weekStr};
})();

/* ============ App.showToast / openModal / closeModal ============ */
App.showToast = function(msg){
  const el=document.createElement('div');el.className='toast';el.textContent=msg;
  document.getElementById('toast-container').appendChild(el);
  setTimeout(()=>{el.style.opacity='0';el.style.transition='opacity .3s';setTimeout(()=>el.remove(),300)},2200);
};
App.openModal = function(titleHTML,bodyHTML){
  const c=document.getElementById('modal-container');
  document.getElementById('modal-body').innerHTML=
    `<div class="modal-header"><h3>${titleHTML}</h3><div class="modal-close" id="modal-close">×</div></div>${bodyHTML}`;
  c.classList.add('visible');
  document.getElementById('modal-close').onclick=App.closeModal;
  document.getElementById('modal-overlay').onclick=App.closeModal;
};
App.closeModal = function(){document.getElementById('modal-container').classList.remove('visible')};
App.confirmModal = function(msg,onOk){
  App.openModal('确认',`<p style="font-size:var(--f-md);margin-bottom:14px">${msg}</p>
    <div class="form-actions"><button class="btn btn-ghost" onclick="App.closeModal()">取消</button>
    <button class="btn btn-danger" id="confirm-ok-btn">确定</button></div>`);
  document.getElementById('confirm-ok-btn').onclick=()=>{App.closeModal();onOk()};
};
// 全局图片放大层（全屏预览）
App.openLightbox = function(src){
  const lb=document.getElementById('img-lightbox');
  if(!lb||!src)return;
  lb.querySelector('img').src=src;
  lb.classList.add('show');
};
App.closeLightbox = function(){
  const lb=document.getElementById('img-lightbox');
  if(lb)lb.classList.remove('show');
};

/* ============ App.Store ============ */
App.Store = (function(){
  const KEYS={
    items:'mj_items',daily:'mj_daily',projects:'mj_projects',oils:'mj_oils',
    inspiration:'mj_inspiration',profit:'mj_profit',checklists:'mj_checklists',
    settings:'mj_settings',reports:'mj_monthly_reports',books:'mj_books',
    moment:'mj_moment'
  };
  function read(key,def){try{const v=localStorage.getItem(key);return v?JSON.parse(v):def}catch(e){return def}}
  function write(key,val){try{localStorage.setItem(key,JSON.stringify(val));return true}catch(e){App.showToast('存储失败，可能空间不足');return false}}

  // settings
  function getSettings(){
    return Object.assign({city:'绍兴',sidebarCollapsed:false,homeSummaryHidden:false,translationApiKey:''},read(KEYS.settings,{}));
  }
  function setSettings(s){write(KEYS.settings,Object.assign(getSettings(),s))}

  // items
  function getItems(){return read(KEYS.items,[])}
  function setItems(arr){write(KEYS.items,arr)}

  // daily
  function getDailyAll(){return read(KEYS.daily,{})}
  function getDaily(date){const all=getDailyAll();return all[date]||{quickNotes:[],tasks:[],habits:[]}}
  function setDaily(date,entry){const all=getDailyAll();all[date]=entry;write(KEYS.daily,all)}

  // projects
  function getProjects(){return read(KEYS.projects,[])}
  function setProjects(arr){write(KEYS.projects,arr)}

  // oils
  function getOils(){return read(KEYS.oils,[])}
  function setOils(arr){write(KEYS.oils,arr)}

  // inspiration
  function getInspiration(){return read(KEYS.inspiration,{prompts:[],materials:[],phraseHistory:[]})}
  function setInspiration(d){write(KEYS.inspiration,d)}

  // profit
  function getProfitAll(){return read(KEYS.profit,{})}
  function getProfit(date){const all=getProfitAll();return all[date]||{date,entries:[]}}
  function setProfit(date,entry){const all=getProfitAll();all[date]=entry;write(KEYS.profit,all)}

  // checklists
  function getChecklists(){return read(KEYS.checklists,{folders:[],lists:[]})}
  function setChecklists(d){write(KEYS.checklists,d)}

  // books
  function getBooks(){return read(KEYS.books,[])}
  function setBooks(arr){write(KEYS.books,arr)}

  // moment（每日一瞬）
  function getMomentAll(){return read(KEYS.moment,{})}
  function setMomentAll(obj){write(KEYS.moment,obj)}
  function getMoment(date){const all=getMomentAll();return all[date]||null}
  function setMoment(date,rec){
    const all=getMomentAll();
    all[date]=Object.assign(all[date]||{},rec,{date,updatedAt:new Date().toISOString()});
    if(!all[date].createdAt)all[date].createdAt=all[date].updatedAt;
    write(KEYS.moment,all);
    return all[date];
  }

  // reports
  function getReports(){return read(KEYS.reports,[])}
  function setReports(arr){write(KEYS.reports,arr)}

  // 全局搜索
  function searchAll(query){
    if(!query||!query.trim())return [];
    const q=query.toLowerCase();
    const results=[];
    const pushRes=(module,id,snippet,path)=>{
      const idx=snippet.toLowerCase().indexOf(q);
      const start=Math.max(0,idx-12);
      const snippetCut=snippet.slice(start,start+60);
      const marked=App.Utils.escapeHtml(snippetCut).replace(new RegExp(App.Utils.escapeHtml(query),'ig'),m=>`<mark>${m}</mark>`);
      results.push({module,id,snippet:marked,path,raw:snippet.slice(start,start+60)});
    };
    // items
    getItems().forEach(it=>{
      const txt=`${it.name||''} ${it.purchaseDate} ${it.platform} ${it.price} ${it.status} ${it.note||''}`;
      if(txt.toLowerCase().includes(q))pushRes('物品小集',it.id,`${it.name||''} ${it.platform} ¥${it.price}`,'');
    });
    // daily
    const daily=getDailyAll();
    Object.keys(daily).forEach(date=>{
      const e=daily[date];
      (e.quickNotes||[]).forEach(n=>{if((n.content||'').toLowerCase().includes(q))pushRes('每日小事·速记',n.id,`${date} ${n.content}`,date)});
      (e.tasks||[]).forEach(t=>{if((t.content||'').toLowerCase().includes(q))pushRes('每日小事·事项',t.id,`${date} ${t.content}`,date)});
      (e.habits||[]).forEach(h=>{if((h.moodNote||'').toLowerCase().includes(q))pushRes('每日小事·心情',h.id,`${date} ${h.moodNote}`,date)});
    });
    // projects
    getProjects().forEach(p=>{
      const txt=`${p.title} ${p.description||''} ${(p.tasks||[]).map(t=>t.title).join(' ')}`;
      if(txt.toLowerCase().includes(q))pushRes('项目小栏',p.id,`${p.title} ${p.description||''}`,'');
    });
    // oils
    getOils().forEach(o=>{
      const txt=`${o.title} ${o.ingredients} ${o.note||''}`;
      if(txt.toLowerCase().includes(q))pushRes('精油小册',o.id,`${o.title} ${o.ingredients}`,'');
    });
    // inspiration
    const ins=getInspiration();
    (ins.prompts||[]).forEach(p=>{if((p.title||'').toLowerCase().includes(q))pushRes('灵感·清单',p.id,p.title,'')});
    (ins.materials||[]).forEach(m=>{if((m.content||'').toLowerCase().includes(q))pushRes('灵感·素材',m.id,m.content,'')});
    (ins.phraseHistory||[]).forEach(p=>{if((p.source||'').toLowerCase().includes(q)||(p.target||'').toLowerCase().includes(q))pushRes('灵感·翻译',p.id,`${p.source} → ${p.target}`,'')});
    // profit
    const profitAll=getProfitAll();
    Object.keys(profitAll).forEach(date=>{
      const pe=profitAll[date];
      const txt=`${pe.note||''}`;
      if(txt.toLowerCase().includes(q))pushRes('盈亏管理',date,`${date} 盈亏备注 ${pe.note}`,'');
    });
    // checklists
    const cl=getChecklists();
    (cl.lists||[]).forEach(l=>{
      const txt=`${l.title} ${(l.items||[]).map(i=>i.content).join(' ')}`;
      if(txt.toLowerCase().includes(q))pushRes('清单小盒',l.id,`${l.title} ${(l.items||[]).map(i=>i.content).join(' ')}`,'');
    });
    // books
    getBooks().forEach(b=>{
      const txt=`${b.title||''} ${(b.author||'')} ${b.status||''} ${(b.note||'')}`;
      if(txt.toLowerCase().includes(q))pushRes('书海小藏',b.id,`${b.title||''} ${b.status||''}`,'');
    });
    // moment（每日一瞬）
    const momentAll=getMomentAll();
    Object.keys(momentAll).forEach(date=>{
      const m=momentAll[date];
      const txt=`${m.text||''}`;
      if(txt.toLowerCase().includes(q))pushRes('每日一瞬',date,`${date} ${(m.text||'').slice(0,40)}`,date);
    });
    return results;
  }

  // 今日摘要
  function getTodaySummary(){
    const today=todayStr();
    const d=getDaily(today);
    const todos=(d.tasks||[]).filter(t=>t.type==='todo'&&!t.completed).length;
    const habitKeys=['weight','shampoo','iron','reading','mood'];
    const doneKeys=(d.habits||[]).map(h=>h.habitKey);
    const pendingHabits=habitKeys.filter(k=>!doneKeys.includes(k)).length;
    // 临近截止项目（3天内）
    const now=new Date();now.setHours(0,0,0,0);
    const soonProjects=getProjects().filter(p=>{
      if(p.status!=='active')return false;
      const end=App.Utils.parseDate(p.endDate);
      if(!end)return false;
      const days=Math.ceil((end-now)/86400000);
      return days>=0&&days<=3;
    });
    return {todos,pendingHabits,soonProjects};
  }

  // 月度复盘
  function generateMonthlyReport(year,month){
    const ym=`${year}-${String(month).padStart(2,'0')}`;
    const daysInMonth=new Date(year,month,0).getDate();
    const daily=getDailyAll();
    const reflections={quickNotes:[],moodNotes:[],completedTodos:0,totalTodos:0,reminders:0};
    for(let d=1;d<=daysInMonth;d++){
      const ds=`${ym}-${String(d).padStart(2,'0')}`;
      const e=daily[ds];if(!e)continue;
      (e.quickNotes||[]).forEach(n=>{if(n.content)reflections.quickNotes.push({date:ds,content:n.content})});
      (e.tasks||[]).forEach(t=>{
        if(t.type==='todo'){reflections.totalTodos++;if(t.completed)reflections.completedTodos++}
        else if(t.type==='reminder')reflections.reminders++;
      });
      const moodRec=(e.habits||[]).find(h=>h.habitKey==='mood');
      if(moodRec&&moodRec.mood){reflections.moodNotes.push({date:ds,mood:moodRec.mood,note:moodRec.moodNote||''});}
    }
    // 消费
    const spendingTotal=getItems().filter(it=>(it.purchaseDate||'').startsWith(ym)).reduce((s,it)=>s+(Number(it.price)||0),0);
    // 项目
    const projectProgress=getProjects().filter(p=>p.status==='active').map(p=>{
      const total=(p.tasks||[]).length;
      const done=(p.tasks||[]).filter(t=>t.completed).length;
      return {projectId:p.id,title:p.title,progress:total?Math.round(done/total*100):0,total,done};
    });
    const report={id:App.Utils.generateUUID(),yearMonth:ym,reflections,spendingTotal,projectProgress,generatedAt:new Date().toISOString()};
    const reports=getReports();
    const idx=reports.findIndex(r=>r.yearMonth===ym);
    if(idx>=0)reports[idx]=report;else reports.push(report);
    setReports(reports);
    return report;
  }

  function todayStr(){return App.Utils.todayStr()}

  // 清理：删除单个模块的全部数据
  function clearKey(key){localStorage.removeItem(KEYS[key])}
  // 清理：删除某月（含）之前的所有每日记录，返回删除天数
  function clearDailyBefore(monthStr){
    const all=getDailyAll();
    const cut=monthStr+'-32'; // 该月最后一天之后
    let n=0;
    Object.keys(all).forEach(d=>{ if(d<cut){delete all[d];n++;} });
    write(KEYS.daily,all);
    return n;
  }
  // 直接写回整个每日记录对象（用于批量修改后保存）
  function setDailyRaw(all){write(KEYS.daily,all)}

  return {
    KEYS,getSettings,setSettings,
    getItems,setItems,
    getDailyAll,getDaily,setDaily,
    getProjects,setProjects,
    getOils,setOils,
    getInspiration,setInspiration,
    getProfitAll,getProfit,setProfit,
    getChecklists,setChecklists,
    getBooks,setBooks,
    getMomentAll,setMomentAll,getMoment,setMoment,
    getReports,setReports,
    exportAll,importAll,
    searchAll,getTodaySummary,generateMonthlyReport,
    clearKey,clearDailyBefore,setDailyRaw
  };
  // 整库快照导出：把所有 key 原样读出，保证 100% 完整
  function exportAll(){
    const data={};
    Object.keys(KEYS).forEach(k=>{ data[k]=read(KEYS[k],null); });
    return {
      _app:'xiaowanzi-workbench',
      _version:1,
      _exportedAt:new Date().toISOString(),
      _keys:Object.assign({},KEYS),
      data
    };
  }
  // 整库快照导入：把备份原样写回每个 key，完整还原
  function importAll(snapshot,opts){
    opts=opts||{};
    if(!snapshot||!snapshot.data) throw new Error('备份文件格式不正确');
    let count=0;
    Object.keys(snapshot.data).forEach(k=>{
      const val=snapshot.data[k];
      if(val===null||val===undefined) return;
      // 优先用备份里记录的 key 名，回退到当前 KEYS
      const storageKey=(snapshot._keys&&snapshot._keys[k])||KEYS[k]||k;
      if(!storageKey) return;
      write(storageKey,val); count++;
    });
    return count;
  }
})();

/* ============ App.Speech ============ */
/* 说明：iOS Safari 的 webkitSpeechRecognition 因系统限制（service-not-allowed）
   基本无法使用。这里采用最稳定的方案：点击 🎤 按钮后聚焦输入框唤起键盘，
   引导用户使用 iOS 键盘左下角系统听写键 🎙️ 直接输入。
   这样无需 HTTPS、无需权限授权，转写质量与系统一致。
   同时保留对桌面 Chrome webkitSpeechRecognition 的尝试（作为增强）。 */
App.Speech = (function(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  const SECURE=(typeof isSecureContext==='function'?isSecureContext():false)||location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1'||location.protocol==='file:';
  // 仅在桌面 Chrome（非 iOS）且 HTTPS 下尝试 webkit
  const ua=navigator.userAgent||'';
  const isIOS=/iPad|iPhone|iPod/.test(ua)&&!/CriOS/.test(ua);
  const isAndroid=/Android/.test(ua);
  const USE_WEBKIT=!!SR&&SECURE&&!isIOS;
  let rec=null;let listening=false;let onEndCb=null;let timeoutId=null;

  function isSupported(){return true} // 始终可用（退路是键盘听写）
  function isSecure(){return SECURE}
  function canUseWebkit(){return USE_WEBKIT}
  function describeSupport(){
    if(isIOS)return 'iOS 上请用键盘左下角 🎙️ 听写键';
    if(!SR)return '当前浏览器不支持语音识别，请用键盘输入';
    if(!SECURE)return '需要 HTTPS 或 localhost 才能用语音识别';
    return null;
  }

  function startListening(inputEl,onEnd){
    onEndCb=onEnd||null;
    // iOS：直接走键盘听写退路，不调用 webkit（避免 service-not-allowed）
    if(!USE_WEBKIT){
      fallbackToKeyboard(inputEl,true);
      if(onEndCb){const cb=onEndCb;onEndCb=null;cb()}
      return;
    }
    // 桌面 Chrome / Android：尝试 webkitSpeechRecognition
    if(listening){stopListening();return}
    if(!inputEl){if(onEndCb){const cb=onEndCb;onEndCb=null;cb()}return}
    try{
      rec=new SR();
      rec.lang='zh-CN';rec.continuous=false;rec.interimResults=true;rec.maxAlternatives=1;
      let finalText='';
      const targetEl=inputEl;
      rec.onresult=(e)=>{
        let interim='';
        for(let i=e.resultIndex;i<e.results.length;i++){
          if(e.results[i].isFinal)finalText+=e.results[i][0].transcript;
          else interim+=e.results[i][0].transcript;
        }
        const base=targetEl.dataset.speechBase||'';
        targetEl.value=base+finalText+interim;
        targetEl.dispatchEvent(new Event('input',{bubbles:true}));
      };
      rec.onerror=(e)=>{
        const err=e.error||'未知';
        if(err==='aborted'||err==='no-speech'){stopListening();return}
        // 任何错误都退到键盘听写
        stopListening();
        fallbackToKeyboard(targetEl,err==='service-not-allowed'||err==='not-allowed');
        if(onEndCb){const cb=onEndCb;onEndCb=null;cb()}
      };
      rec.onend=()=>{
        listening=false;
        const ind=document.getElementById('speech-indicator');
        if(ind)ind.classList.remove('visible');
        if(targetEl){
          targetEl.value=(targetEl.dataset.speechBase||'')+finalText;
          targetEl.dispatchEvent(new Event('input',{bubbles:true}));
          targetEl.dispatchEvent(new Event('change',{bubbles:true}));
          delete targetEl.dataset.speechBase;
        }
        if(timeoutId){clearTimeout(timeoutId);timeoutId=null}
        if(onEndCb){const cb=onEndCb;onEndCb=null;cb()}
      };
      targetEl.dataset.speechBase=targetEl.value;
      rec.start();
      listening=true;
      const ind=document.getElementById('speech-indicator');
      if(ind)ind.classList.add('visible');
      timeoutId=setTimeout(()=>{if(listening){stopListening()}},15000);
    }catch(e){
      stopListening();
      fallbackToKeyboard(inputEl,true);
      if(onEndCb){const cb=onEndCb;onEndCb=null;cb()}
    }
  }
  // 退路：聚焦输入框唤起键盘，提示用系统听写键
  function fallbackToKeyboard(inputEl,showHint){
    try{
      if(inputEl&&inputEl.focus){
        // 先聚焦
        inputEl.focus({preventScroll:true});
        // 光标定位到末尾
        const v=inputEl.value||'';
        if(typeof inputEl.setSelectionRange==='function'){
          try{inputEl.setSelectionRange(v.length,v.length)}catch(e){}
        }
        // 对 textarea/contenteditable 强制触发键盘
        if(inputEl.tagName==='TEXTAREA'){
          inputEl.click();
        }
      }
    }catch(e){}
    if(showHint){
      const ua=navigator.userAgent||'';
      const isIOS=/iPad|iPhone|iPod/.test(ua)&&!/CriOS/.test(ua);
      if(isIOS){
        App.showToast('点键盘左下角 🎙️ 听写键说话',4000);
      }else{
        App.showToast('请用键盘输入，或检查麦克风权限',4000);
      }
    }
  }
  function stopListening(){
    listening=false;
    const ind=document.getElementById('speech-indicator');
    if(ind)ind.classList.remove('visible');
    if(timeoutId){clearTimeout(timeoutId);timeoutId=null}
    if(rec){try{rec.stop()}catch(e){}try{rec.abort()}catch(e){}rec=null}
  }
  function isListening(){return listening}
  return {isSupported,isSecure,canUseWebkit,describeSupport,startListening,stopListening,isListening,fallbackToKeyboard};
})();

/* ============ App.Weather ============ */
App.Weather = (function(){
  const WMO={
    0:['☀️','晴'],1:['🌤️','主要晴'],2:['⛅','局部多云'],3:['☁️','阴'],
    45:['🌫️','雾'],48:['🌫️','冻雾'],
    51:['🌦️','小毛毛雨'],53:['🌦️','毛毛雨'],55:['🌧️','大毛毛雨'],
    56:['🌧️','冻毛毛雨'],57:['🌧️','强冻毛毛雨'],
    61:['🌧️','小雨'],63:['🌧️','中雨'],65:['🌧️','大雨'],
    66:['🌧️','冻雨'],67:['🌧️','强冻雨'],
    71:['🌨️','小雪'],73:['🌨️','中雪'],75:['🌨️','大雪'],77:['🌨️','雪粒'],
    80:['🌧️','小阵雨'],81:['🌧️','阵雨'],82:['🌧️','强阵雨'],
    85:['🌨️','小阵雪'],86:['🌨️','强阵雪'],
    95:['⛈️','雷暴'],96:['⛈️','雷暴夹冰雹'],99:['⛈️','强雷暴夹冰雹']
  };
  async function fetchWeather(city){
    let data = await tryFetchWeather(city);
    // 回退：去掉末尾"区/县/镇/乡/街道"等行政区后缀重试，如"绍兴柯桥"→"绍兴"
    if (!data) {
      const m = city.match(/^(.+?)(区|县|镇|乡|街道|新区|开发区)$/);
      if (m) data = await tryFetchWeather(m[1]);
    }
    // 再试逐级截断兜底
    if (!data && city.length > 2) {
      for (let i = city.length - 1; i >= 2 && !data; i--) {
        const fallback = city.slice(0, i);
        if (/[区县镇乡]$/.test(fallback)) continue;
        data = await tryFetchWeather(fallback);
      }
    }
    if (!data) throw new Error('未找到城市：'+city);
    return data;
  }
  async function tryFetchWeather(city){
    try{
      const geoUrl=`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=5&language=zh&format=json`;
      const geoRes=await fetch(geoUrl);
      const geoData=await geoRes.json();
      if(!geoData.results||!geoData.results.length)return null;
      const {latitude,longitude,name,admin1}=geoData.results[0];
      const wUrl=`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current_weather=true&daily=temperature_2m_max,temperature_2m_min,weathercode,precipitation_probability_max&timezone=Asia/Shanghai&forecast_days=1`;
      const wRes=await fetch(wUrl);
      const wData=await wRes.json();
      const current=wData.current_weather;
      const daily=wData.daily;
      const code=current.weathercode;
      const currentT=current.temperature;
      const maxT=daily.temperature_2m_max[0];
      const minT=daily.temperature_2m_min[0];
      const rainProb=daily.precipitation_probability_max?daily.precipitation_probability_max[0]:0;
      const [icon,desc]=WMO[code]||['🌡️','未知'];
      return {
        cityName:name+(admin1&&admin1!==name?('·'+admin1):''),
        icon,desc,
        temp:`当前 ${Math.round(currentT)}° / 今日 ${Math.round(minT)}° ~ ${Math.round(maxT)}°`,
        rain: rainProb>50?`降雨概率 ${rainProb}%`:(rainProb>20?'可能降雨':'无降雨'),
        hasRain:rainProb>50
      };
    }catch(e){return null}
  }
  return {fetchWeather};
})();

App.Router = (function(){
  // 导航项：按原顺序平铺显示（移除上下分组间隔）
  const NAV_TOP=[
    {view:'home',icon:'🏠',label:'首页',short:'首页'},
    {view:'tasks',icon:'📋',label:'事项管理',short:'事项'},
    {view:'daily',icon:'📝',label:'每日小事',short:'每日'},
    {view:'moment',icon:'📸',label:'每日一瞬',short:'一瞬'},
    {view:'projects',icon:'📊',label:'项目小栏',short:'项目'},
    {view:'profit',icon:'📈',label:'盈亏管理',short:'盈亏'}
  ];
  const NAV_BOTTOM=[
    {view:'items',icon:'📦',label:'物品小集',short:'物品'},
    {view:'oils',icon:'🌿',label:'精油小册',short:'精油'},
    {view:'inspiration',icon:'💡',label:'灵感小站',short:'灵感'},
    {view:'checklist',icon:'✅',label:'清单小盒',short:'清单'},
    {view:'books',icon:'📚',label:'书海小藏',short:'书海'}
  ];
  const NAV=[...NAV_TOP,...NAV_BOTTOM];
  const rendered={};
  function init(){
    // 渲染导航（上方常用 + 下方工具，中间用间隔分开）
    const bindNav=(ul,list)=>{
      ul.innerHTML=list.map(n=>{
        return `<li class="nav-item nav-${n.view}" data-view="${n.view}"><span class="nav-icon">${n.icon}</span><span class="nav-short">${n.short}</span><span class="nav-label">${n.label}</span></li>`;
      }).join('');
      ul.querySelectorAll('.nav-item').forEach(el=>{
        el.addEventListener('click',()=>{
          navigate(el.dataset.view);
          if(window.innerWidth<600)collapseSidebar();
        });
      });
    };
    bindNav(document.getElementById('nav-top'),NAV_TOP);
    bindNav(document.getElementById('nav-bottom'),NAV_BOTTOM);
    window.addEventListener('hashchange',handleRoute);
    if(!location.hash)location.hash='#home';
    else handleRoute();
  }
  function handleRoute(){
    const view=(location.hash||'#home').slice(1);
    document.querySelectorAll('.view-panel').forEach(el=>el.classList.remove('active'));
    const panel=document.getElementById('view-'+view);
    if(!panel){location.hash='#home';return}
    panel.classList.add('active');
    document.querySelectorAll('.nav-item').forEach(el=>el.classList.toggle('active',el.dataset.view===view));
    document.body.classList.forEach(cls=>{if(cls.startsWith('view-'))document.body.classList.remove(cls)});
    document.body.classList.add('view-'+view);
    const mod=App.Modules&&App.Modules[cap(view)];
    if(!rendered[view]){
      if(mod&&mod.render){mod.render();rendered[view]=true}
    }else{
      // 优先 onShow（轻量重绘，不重建面板）；缺失时回退到 render() 以始终刷新最新数据，
      // 避免“切换走再回来数据不更新/列表消失”的问题。
      if(mod&&mod.onShow)mod.onShow();
      else if(mod&&mod.render)mod.render();
    }
    document.getElementById('view-container').scrollTop=0;
  }
  function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
  function navigate(view){location.hash='#'+view}
  function getCurrentView(){return(location.hash||'#home').slice(1)}

  function expandSidebar(){
    document.getElementById('sidebar').classList.add('expanded');
    document.getElementById('sidebar-overlay').classList.add('visible');
    document.getElementById('sidebar-logo').textContent='燕燕小丸子';
  }
  function collapseSidebar(){
    document.getElementById('sidebar').classList.remove('expanded');
    document.getElementById('sidebar-overlay').classList.remove('visible');
    document.getElementById('sidebar-logo').textContent='燕';
  }
  // 强制全量刷新：清空渲染缓存，当前视图重新渲染（用于导入数据后整体还原）
  function forceReload(){
    const view=getCurrentView();
    Object.keys(rendered).forEach(k=>delete rendered[k]);
    const mod=App.Modules&&App.Modules[cap(view)];
    if(mod&&mod.render){mod.render();rendered[view]=true}
    else handleRoute();
  }
  return {init,navigate,getCurrentView,expandSidebar,collapseSidebar,forceReload,NAV};
})();

App.bindSpeechBtns = function(scope){
  (scope||document).querySelectorAll('.speech-btn').forEach(btn=>{
    if(btn.dataset.bound)return;btn.dataset.bound='1';
    let active=false;
    const toggle=(e)=>{
      e.preventDefault();e.stopPropagation();
      const t=document.getElementById(btn.dataset.target);if(!t)return;
      // 如果正在录音（桌面 Chrome），点一下停止
      if(active&&App.Speech.isListening()){
        App.Speech.stopListening();

        return;
      }
      active=true;btn.textContent='⏹️';btn.style.background='var(--c-pink)';btn.style.color='#fff';
      App.Speech.startListening(t,()=>{
        active=false;btn.textContent='🎤';btn.style.background='';btn.style.color='';
      });
    };
    btn.addEventListener('click',toggle);
  });
};

/* ---- OCR 工具（精油/灵感共用）---- */
App.OCR = (function(){
  let tesseractPromise=null;
  function ensure(){
    if(tesseractPromise)return tesseractPromise;
    tesseractPromise=new Promise((res,rej)=>{
      const s=document.createElement('script');
      s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
      s.onload=res;s.onerror=()=>{tesseractPromise=null;rej(new Error('OCR引擎加载失败'))};
      document.head.appendChild(s);
    });
    return tesseractPromise;
  }
  async function recognize(file,onProgress){
    if(!window.Tesseract)await ensure();
    const worker=await Tesseract.createWorker('chi_sim+eng',1,{logger:m=>{
      if(m.status==='recognizing text'&&onProgress)onProgress(m.progress);
    }});
    const {data:{text}}=await worker.recognize(file);
    await worker.terminate();
    return text.trim();
  }
  return {recognize,ensure};
})();

  function renderHomeCover(){
    const today=App.Utils.todayStr();
    const todayM=App.Store.getMoment(today);
    // 当天没拍照片时，回退到最近一天已上传的照片，直到当天更新为止

      for(const d of dates){

      }
    }
    const d=new Date();
    const wd=['日','一','二','三','四','五','六'][d.getDay()];
    const dateLabel=`${d.getMonth()+1}月${d.getDate()}日 周${wd}`;

      text=srcM.text?App.Utils.escapeHtml(srcM.text):'记录今日一瞬';
    }else{
      photo=`<div class="hc-ph">📸</div>`;
      text='记录今天的一瞬';
    }
    const fallbackHint=fallbackDate?`<div class="hc-fallback">📷 ${fallbackDate.slice(5).replace('-','/')} 的一瞬</div>`:'';
    return `<div class="home-cover ${srcM&&srcM.photo?'':'hc-empty'}" id="home-cover">
      ${photo}
      <div class="hc-info">
        <div class="hc-text">${text}</div>
        <div class="hc-meta">
          <div class="hc-date">${dateLabel}</div>
          ${fallbackHint}
        </div>
      </div>
    </div>`;
  }
  // 仅刷新封面（导航回首页时 onShow 调用，避免整页重绘）
  function refreshHomeCover(){
    const panel=document.getElementById('view-home');
    if(!panel)return;
    const wrap=document.createElement('div');
    wrap.innerHTML=renderHomeCover();
    const newNode=wrap.firstElementChild;
    const old=document.getElementById('home-cover');

    else if(newNode&&!old)panel.insertBefore(newNode,panel.firstChild);
    else if(old)old.remove();
    bindHomeCover();
  }
  function bindHomeCover(){
    const c=document.getElementById('home-cover');
    if(!c)return;
    c.addEventListener('click',()=>{
      const img=c.querySelector('#hc-photo');
      if(img)App.openLightbox(img.src);

    });

  function renderSummary(){
    const s=App.Store.getTodaySummary();
    const body=document.getElementById('summary-body');
    if(s.todos===0&&s.pendingHabits===0&&s.soonProjects.length===0){
      body.innerHTML='<div class="summary-empty">今日无待办、无待打卡、无项目预警 🌿</div>';
      return;
    }
    body.innerHTML=`<ul class="summary-list">
      <li>📋 未完成待办：<span class="num ${s.todos===0?'zero':''}">${s.todos}</span> 项</li>
      <li>✅ 待打卡：<span class="num ${s.pendingHabits===0?'zero':''}">${s.pendingHabits}</span> 项</li>
      <li>⚠️ 临近截止项目：<span class="num ${s.soonProjects.length===0?'zero':''}">${s.soonProjects.length}</span> 项</li>
      ${s.soonProjects.length?`<li style="font-size:var(--f-xs);color:var(--text-3)">${s.soonProjects.map(p=>p.title).join('、')}</li>`:''}
    </ul>`;
  }
  function renderHomeTasks(){
    try{
      const today=App.Utils.todayStr();
      const e=App.Store.getDaily(today);
      const tasks=e.tasks||[];
      const el=document.getElementById('home-tasks');
      const countEl=document.getElementById('home-tasks-count');
      if(!el)return;
      // 按类型和完成状态分组
      const pending=tasks.filter(t=>!t.completed);
      const done=tasks.filter(t=>t.completed);
      // 统计
      const todoTotal=tasks.filter(t=>t.type==='todo').length;
      const todoDone=tasks.filter(t=>t.type==='todo'&&t.completed).length;
      const remindTotal=tasks.filter(t=>t.type==='reminder').length;
      if(countEl){
        let label='';
        if(todoTotal>0) label+=`待办 ${todoDone}/${todoTotal}`;
        if(remindTotal>0) label+=` 提醒 ${remindTotal}`;
        if(!label) label='0 项';
        countEl.textContent=label;
      }
      if(!tasks.length){el.innerHTML='<div class="summary-empty">今日暂无事项 🌿</div>';return}
      // 渲染单项
      const renderItem=t=>`
        <div class="home-task-item ${t.type} ${t.type==='todo'&&t.completed?'completed':''}" data-id="${t.id}">
          <span class="home-task-check ${t.type==='todo'?'todo-check':''} ${t.type==='todo'&&t.completed?'checked':''}">${t.type==='todo'?(t.completed?'✓':''):'📌'}</span>
          <span class="home-task-content">${App.Utils.escapeHtml(t.content)}</span>
        </div>`;
      let html=pending.map(renderItem).join('');
      // 已完成区域（折叠）
      if(done.length){
        html+=`<div class="home-completed-section" id="home-completed-sec">
          <div class="home-completed-toggle">✅ 已完成 (${done.length}) <span style="margin-left:auto;font-size:10px">▸</span></div>
          <div class="home-completed-body">${done.map(renderItem).join('')}</div>
        </div>`;
      }
      el.innerHTML=html||'<div class="summary-empty">今日暂无事项 🌿</div>';
      // 点击待办切换完成状态
      el.querySelectorAll('.home-task-item.todo').forEach(item=>item.addEventListener('click',()=>{
        const id=item.dataset.id;
        const en=App.Store.getDaily(today);
        const t=en.tasks.find(x=>x.id===id);if(!t)return;
        t.completed=!t.completed;
        App.Store.setDaily(today,en);
        renderHomeTasks();renderSummary();
      }));
      // 已完成折叠/展开
      const sec=document.getElementById('home-completed-sec');
      if(sec)sec.querySelector('.home-completed-toggle').addEventListener('click',()=>sec.classList.toggle('open'));
    }catch(e){console.error('renderHomeTasks error',e)}
  }
  function initReportCard(){
    try{
      const now=new Date();
      const ym=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
      const reports=App.Store.getReports();
      let cur=reports.find(r=>r.yearMonth===ym);
      const body=document.getElementById('report-body');
      const actions=document.getElementById('report-actions');
      const statusEl=document.getElementById('report-status');
      function renderCard(){
        cur=App.Store.getReports().find(r=>r.yearMonth===ym);
        if(body)body.innerHTML=cur?renderReportToHTML(cur):'<div class="summary-empty">本月尚未生成简报，点击下方按钮生成</div>';
        if(actions){
          if(cur){
            actions.innerHTML=`<button class="btn btn-ghost btn-sm" id="export-report-btn">导出CSV</button><button class="btn btn-danger btn-sm" id="clear-report-btn">清除简报</button>`;
            document.getElementById('export-report-btn').addEventListener('click',()=>{
              const r=App.Store.getReports().find(x=>x.yearMonth===ym);
              if(!r){App.showToast('请先生成简报');return}
              const rows=[];
              const ref=r.reflections||{};
              rows.push({类别:'待办完成',数值:`${ref.completedTodos||0}/${ref.totalTodos||0}`,月份:r.yearMonth});
              rows.push({类别:'事项提醒',数值:(ref.reminders||0)+'条',月份:r.yearMonth});
              rows.push({类别:'灵感速记条数',数值:(ref.quickNotes||[]).length,月份:r.yearMonth});
              rows.push({类别:'心情记录条数',数值:(ref.moodNotes||[]).length,月份:r.yearMonth});
              rows.push({类别:'当月消费合计',数值:r.spendingTotal.toFixed(2)+'元',月份:r.yearMonth});
              r.projectProgress.forEach(p=>rows.push({类别:'项目进度-'+p.title,数值:p.progress+'%',月份:r.yearMonth}));
              App.Utils.exportCSV(rows,'月度复盘_'+ym);
            });
            document.getElementById('clear-report-btn').addEventListener('click',()=>{
              const newReports=App.Store.getReports().filter(r=>r.yearMonth!==ym);
              App.Store.setReports(newReports);
              renderCard();App.showToast('简报已清除');
            });
          }else{
            actions.innerHTML=`<button class="btn btn-primary btn-sm" id="gen-report-btn">生成本月简报</button>`;
            document.getElementById('gen-report-btn').addEventListener('click',()=>{
              const r=App.Store.generateMonthlyReport(now.getFullYear(),now.getMonth()+1);
              renderCard();App.showToast('简报已生成');
              // 展开详情
              const details=document.getElementById('monthly-report-card');
              if(details)details.open=true;
            });
          }
        }
        if(statusEl)statusEl.textContent=cur?'已生成':'未生成';
      }
      renderCard();
    }catch(e){console.error('initReportCard error',e)}
  }
  function renderReportToHTML(r){
    const ref=r.reflections||{};
    const projStr=r.projectProgress.length?r.projectProgress.map(p=>`${p.title} ${p.progress}%`).join('、'):'无活跃项目';
    const moodName=m=>{return{relaxed:'舒心',plain:'平淡',tired:'疲惫',irritated:'烦躁',joyful:'愉悦'}[m]||m};
    const notes=(ref.quickNotes||[]).slice(0,8).map(n=>`<div style="padding:4px 0;border-bottom:1px dashed var(--border);font-size:var(--f-xs);color:var(--text-3)">${n.date}</div><div style="padding:2px 0 8px">${App.Utils.escapeHtml(n.content)}</div>`).join('')||'<div class="summary-empty">本月暂无灵感速记</div>';
    const moods=(ref.moodNotes||[]).slice(0,8).map(m=>`<div style="padding:4px 0;border-bottom:1px dashed var(--border);font-size:var(--f-xs);color:var(--text-3)">${m.date} · ${moodName(m.mood)}</div><div style="padding:2px 0 8px">${App.Utils.escapeHtml(m.note)||'无备注'}</div>`).join('')||'<div class="summary-empty">本月暂无心情记录</div>';
    return `
      <div class="report-section">
        <h4>事情与感想</h4>
        <div class="rs-content">
          <div class="report-stat"><span>待办完成</span><span>${ref.completedTodos||0} / ${ref.totalTodos||0}</span></div>
          <div class="report-stat"><span>事项提醒</span><span>${ref.reminders||0} 条</span></div>
        </div>
      </div>
      <div class="report-section">
        <h4>灵感速记</h4>
        <div class="rs-content">${notes}</div>
      </div>
      <div class="report-section">
        <h4>心情记录</h4>
        <div class="rs-content">${moods}</div>
      </div>
      <div class="report-section">
        <h4>消费记录</h4>
        <div class="rs-content">当月消费合计：<b>¥${r.spendingTotal.toFixed(2)}</b></div>
      </div>
      <div class="report-section">
        <h4>项目进度</h4>
        <div class="rs-content">${projStr}</div>
      </div>`;
  }
  function moodName(m){return{relaxed:'舒心',plain:'平淡',tired:'疲惫',irritated:'烦躁',joyful:'愉悦'}[m]||m}
  function habitName(k){return{shampoo:'洗头',iron:'补铁维生素',reading:'阅读',weight:'体重',mood:'心情'}[k]||k}
  function onShow(){refreshHomeCover();renderHomeTasks();renderSummary();}
  App.renderReportToHTML=renderReportToHTML;
  return {render,onShow};
})();

App.Modules.Items = (function(){
  const STATUSES=['在用','闲置','已出','损坏'];
  function render(){
    const panel=document.getElementById('view-items');
    panel.innerHTML=`
      <div class="view-header">
